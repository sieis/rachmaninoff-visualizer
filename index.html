      // so they stay in screen pixels.
      ctx.save();
      ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(s, s);
      ctx.strokeStyle = `hsla(${hue}, ${sat}%, 60%, ${alpha * 0.12})`;
      const path = shape.paths ? shape.paths[i] : shape.path;
      ctx.lineWidth = (4 + 3 * lv) * lw / s; ctx.stroke(path);
      ctx.strokeStyle = `hsla(${hue}, ${sat}%, ${66 + 12 * lv}%, ${Math.min(1, alpha * 0.8)})`;
      ctx.lineWidth = lw / s; ctx.stroke(path);
      ctx.restore();
    }
    if (wire) drawWires(dt, now, shape, cx, cy, tf, keyTop);
    // Notes in the other modes still light the figure; these skip Wireframe notes
    if (!wire || uses(0, 1, 3)) {
      if (reveal) drawLit(now, shape, cx, cy, tf);
      if (shape.fifths) drawChord(now, cx, cy, tf[0][0], tf[0][1]);
      if (react > 0) drawThreads(now, cx, cy, R, sym);
    }
    ctx.restore();
  }

  // Rounded bar whose sides follow off(y), a sideways shift that varies with height
  function wavyRect(c, x, y, w, h, r, off) {
    r = Math.min(r, w / 2, h / 2);
    const y1 = y + h, a = Math.max(y + r, -20), b = Math.min(y1 - r, H + 20);
    c.moveTo(x + off(y1 - r), y1 - r);
    for (let yy = b; yy > a; yy -= 5) c.lineTo(x + off(yy), yy);
    c.lineTo(x + off(y + r), y + r);
    c.arcTo(x + off(y), y, x + w / 2 + off(y), y, r);
    c.arcTo(x + w + off(y), y, x + w + off(y + r), y + r, r);
    for (let yy = a; yy < b; yy += 5) c.lineTo(x + w + off(yy), yy);
    c.lineTo(x + w + off(y1 - r), y1 - r);
    c.arcTo(x + w + off(y1), y1, x + w / 2 + off(y1), y1, r);
    c.arcTo(x + off(y1), y1, x + off(y1 - r), y1 - r, r);
    c.closePath();
  }

  // ---------- Bars flatten against the top of the screen ----------
  const smears = []; // { x, w, hue, start, end }  end is set once the bar's tail has gone through
  function drawSmears(now) {
    for (let i = smears.length - 1; i >= 0; i--) {
      const s = smears[i];
      const a = s.end == null ? 1 : 1 - (now - s.end) / 600;
      if (a <= 0) { smears[i] = smears[smears.length - 1]; smears.pop(); continue; }
      if (s.x == null) continue; // the bar crossed the top edge within a single frame
      const rx = s.w * (0.6 + 1.9 * (1 - Math.exp(-(now - s.start) / 160)));
      // One gradient per hue, one unit wide; the transform stretches it to the smear
      ctx.fillStyle = gradient('smear:' + s.hue, () => {
        const g = ctx.createLinearGradient(-1, 0, 1, 0);
        g.addColorStop(0, `hsla(${s.hue}, 95%, 60%, 0)`);
        g.addColorStop(0.5, `hsla(${s.hue}, 95%, 70%, 0.9)`);
        g.addColorStop(1, `hsla(${s.hue}, 95%, 60%, 0)`);
        return g;
      });
      ctx.globalAlpha = a;
      ctx.setTransform(DPR * rx, 0, 0, DPR, DPR * s.x, 0);
      ctx.beginPath(); ctx.ellipse(0, 0, 1, 7, 0, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  // ---------- Weather: rain or snow that lands on the top edge of the keyboard ----------
  const RAIN = 1, SNOW = 2, MAX_WEATHER = 2500;
  const falling = [];  // { type, x, y, vx, vy, z, phase }  z is depth: 0.35 far, 1 near
  const splash = [];   // { type, x, y, vx, vy, life, max, z }  type 'ring' is a rain ripple
  const rnd = (a, b) => a + Math.random() * (b - a);
  // Weather is drawn in batches: everything of one kind and one opacity step shares a path,
  // filled or stroked once with a gradient that carries the keyboard's hues across the screen.
  const STEPS = 8;
  const step = a => Math.min(STEPS - 1, Math.max(0, a * STEPS | 0));
  const pathIn = (set, i) => set[i] ??= new Path2D();
  const tint = (sat, light) => gradient(`tint:${sat}:${light}:${S.hue}:${S.spread}:${W}`, () => {
    const g = ctx.createLinearGradient(0, 0, W, 0);
    for (let i = 0; i <= 12; i++) g.addColorStop(i / 12, `hsl(${S.hue + S.spread * i / 12}, ${sat}%, ${light}%)`);
    return g;
  });
  function paint(set, style, stroke) {
    ctx[stroke ? 'strokeStyle' : 'fillStyle'] = style;
    for (let i = 0; i < STEPS; i++) {
      if (!set[i]) continue;
      ctx.globalAlpha = (i + 0.5) / STEPS;
      stroke ? ctx.stroke(set[i]) : ctx.fill(set[i]);
    }
  }

  function drawWeather(dt, now, keyTop) {
    // Spawn. Switching modes lets what is already in the air finish falling.
    const rate = S.weather === RAIN ? 520 : S.weather === SNOW ? 130 : 0;
    const fast = S.wspeed, wind = S.wwind;
    // Wind leans the fall, so things enter from further upwind and the far side stays covered.
    // Faster weather is spawned faster too: Amount sets how much is in the air, not how much arrives.
    const lean = (S.weather === RAIN ? 0.53 : 1.25) * wind * keyTop; // sideways travel on the way down
    const span = 1.15 * W + Math.abs(lean), left = -0.05 * W - Math.max(lean, 0);
    for (let k = Math.floor(rate * S.wamount * fast * dt * span / 1472 + Math.random()); k > 0 && falling.length < MAX_WEATHER; k--) {
      const z = rnd(0.35, 1), x = left + Math.random() * span;
      if (S.weather === RAIN) falling.push({ type: RAIN, x, y: -30, vx: (0.8 * wind * H - 70) * z * fast, vy: rnd(1.3, 1.7) * H * z * fast, z });
      else falling.push({ type: SNOW, x, y: -6, vx: rnd(-12, 12) + 0.15 * wind * H * z * fast, vy: rnd(0.09, 0.15) * H * z * fast, z, phase: rnd(0, TAU) });
    }
    if (!falling.length && !splash.length) return;

    const streaks = [], flakes = [], drops = [], puffs = [], rings = [];

    for (let i = falling.length - 1; i >= 0; i--) {
      const p = falling[i], snow = p.type === SNOW;
      const vx = snow ? p.vx + Math.sin(now / 900 + p.phase) * 28 * p.z : p.vx;
      p.x += vx * dt; p.y += p.vy * dt;
      if (p.y >= keyTop) {
        // Landed: rain kicks up droplets and a ripple, snow puffs and leaves a melting fleck
        if (snow) {
          for (let k = 2 + (Math.random() * 3 | 0); k > 0; k--)
            splash.push({ type: SNOW, x: p.x, y: keyTop - 1, vx: rnd(-26, 26), vy: rnd(-34, -6), life: rnd(0.5, 1), z: p.z * 0.55 });
          splash.push({ type: SNOW, x: p.x, y: keyTop - 1, vx: 0, vy: 0, life: rnd(1.2, 2.2), z: p.z });
        } else {
          for (let k = 2 + (Math.random() * 3 | 0); k > 0; k--)
            splash.push({ type: RAIN, x: p.x, y: keyTop - 1, vx: rnd(-90, 90) * p.z, vy: rnd(-230, -70) * p.z, life: rnd(0.25, 0.5), z: p.z });
          splash.push({ type: 'ring', x: p.x, y: keyTop, vx: 0, vy: 0, life: 0.35, z: p.z });
        }
        falling[i] = falling[falling.length - 1]; falling.pop();
        continue;
      }
      if (snow) {
        const r = 0.6 + 2.2 * p.z, path = pathIn(flakes, step(0.2 + 0.6 * p.z));
        path.moveTo(p.x + r, p.y); path.arc(p.x, p.y, r, 0, TAU);
      } else {
        const tail = 0.022 + 0.012 * p.z; // seconds of travel shown as a streak
        const path = pathIn(streaks, step((p.z - 0.35) / 0.65)); // grouped by depth
        path.moveTo(p.x, p.y); path.lineTo(p.x - p.vx * tail, p.y - p.vy * tail);
      }
    }

    for (let i = splash.length - 1; i >= 0; i--) {
      const p = splash[i];
      p.max ??= p.life;
      p.life -= dt;
      if (p.life <= 0 || p.y > keyTop) { splash[i] = splash[splash.length - 1]; splash.pop(); continue; }
      const a = p.life / p.max;
      if (p.type === 'ring') {
        const rx = (1 - a) * 16 * p.z + 2, path = pathIn(rings, step(a * 0.7 * p.z));
        path.moveTo(p.x + rx, p.y); path.ellipse(p.x, p.y, rx, rx * 0.3, 0, 0, TAU);
        continue;
      }
      p.vy += (p.type === RAIN ? 900 : 55) * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      const r = p.type === RAIN ? 0.5 + 0.8 * p.z : 0.6 + 2.2 * p.z * (p.vx ? 1 : 0.5 + a * 0.5);
      const path = pathIn(p.type === RAIN ? drops : puffs, step(a * (0.25 + 0.6 * p.z)));
      path.moveTo(p.x + r, p.y); path.arc(p.x, p.y, r, 0, TAU);
    }

    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, keyTop); ctx.clip();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    // Streaks get thicker and brighter with nearness, one stroke per depth step
    ctx.strokeStyle = tint(60, 80);
    for (let i = 0; i < STEPS; i++) {
      if (!streaks[i]) continue;
      const z = 0.35 + 0.65 * (i + 0.5) / STEPS;
      ctx.globalAlpha = 0.12 + 0.4 * z;
      ctx.lineWidth = 0.6 + 0.9 * z;
      ctx.stroke(streaks[i]);
    }
    ctx.lineWidth = 1;
    paint(rings, tint(70, 85), true);
    paint(drops, tint(70, 90));
    paint(flakes, tint(45, 90));
    paint(puffs, tint(45, 90));
    ctx.restore();
  }

  // ---------- Render ----------
  const cores = []; // bar cores waiting to be drawn this frame, seven values each
  const barPath = (off, x, y, w, h, r) => { off ? wavyRect(bctx, x, y, w, h, r, off) : bctx.roundRect(x, y, w, h, r); };
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    const ww = W / WHITES;
    const kh = H * S.keys, keyTop = H - kh;
    const pps = S.speed * H; // pixels per second

    // Background
    ctx.fillStyle = gradient(`bg:${keyTop}:${S.hue + S.spread / 2}`, () => {
      const g = ctx.createLinearGradient(0, 0, 0, keyTop);
      g.addColorStop(0, '#04050a');
      g.addColorStop(1, `hsl(${S.hue + S.spread / 2}, 35%, 7%)`);
      return g;
    });
    ctx.fillRect(0, 0, W, H);
    drawImage(keyTop);

    // Octave guide lines
    ctx.fillStyle = 'rgba(255,255,255,0.035)';
    for (let n = LOW; n <= HIGH; n++) if (n % 12 === 0) ctx.fillRect(keyGeo[n].x * ww, 0, 1, keyTop);

    if (micOn) listen(now);
    downBar.length = 0;
    for (const b of held.values()) downBar[b.note] = b;

    drawClouds(now, keyTop);
    drawGeometry(dt, now, keyTop);
    drawWeather(dt, now, keyTop);

    // Bars
    bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    bctx.clearRect(0, 0, W, H);
    bctx.save();
    bctx.beginPath(); bctx.rect(0, 0, W, keyTop); bctx.clip();
    bctx.globalCompositeOperation = 'lighter';
    cores.length = 0;
    if (!fastGlow) bctx.shadowBlur = S.glow * 34 * DPR;
    for (let i = bars.length - 1; i >= 0; i--) {
      const b = bars[i], g = keyGeo[b.note];
      // Bars are only drawn in the Note visualizer. Elsewhere a bar lasts as long as its key is down.
      if (modeOf(b) !== 1) { if (b.end != null) bars.splice(i, 1); continue; }
      const yTop = keyTop - (now - b.start) / 1000 * pps;
      const yBot = b.end == null ? keyTop : keyTop - (now - b.end) / 1000 * pps;
      if (yBot < -40) { if (b.smear) b.smear.end ??= now; bars.splice(i, 1); continue; }
      const kw = g.w * ww, w = Math.max(2, kw * S.width * girth(b.vel));
      const x = g.x * ww + (kw - w) / 2;
      const h = Math.max(yBot - yTop, 3);
      const r = Math.min(w / 2, h / 2) * S.round;
      const ve = feel(b.vel), light = 48 + ve * 22;

      // Wiggle: a wave runs along the bar so every part of it sways side to side as it climbs.
      // It eases in from zero at the key, so the bar still leaves from the key it belongs to.
      const amp = S.wiggle * ww * 1.3, phase = b.note * 0.9;
      const off = amp > 0.05 ? y => {
        const d = keyTop - y;
        return amp * Math.min(1, d / (ww * 3)) * Math.sin(d * 0.028 + now * 0.005 + phase);
      } : null;

      // Shed particles along the bar; the rate tapers with height but never reaches zero
      if (S.shed > 0) {
        const y0 = Math.max(yTop, 0), y1 = Math.min(yTop + h, keyTop);
        const len = y1 - y0;
        if (len > 0) {
          const rise = (keyTop - (y0 + y1) / 2) / keyTop;
          const taper = 0.12 + 0.88 * Math.exp(-rise * 3.2);
          const want = S.shed * amount() * 0.9 * dt * (0.4 + b.vel) * taper * Math.min(len, 400) / 120;
          for (let k = Math.floor(want + Math.random()); k > 0; k--) {
            const sy = y0 + Math.random() * len;
            spawn(
              x + Math.random() * w + (off ? off(sy) : 0),
              sy,
              (Math.random() - 0.5) * 60 * S.pspread * S.pspeed,
              (Math.random() * 70 - 15) * S.pspeed,
              0.5 + Math.random() * 1.2,
              0.6 + Math.random() * 1.5,
              hueOf(b.note, b.vel) + (Math.random() - 0.5) * 24,
            );
          }
        }
      }

      // Reaching the top of the screen: spread a little left and right, then fade once the tail is through
      if (yTop <= 0) {
        if (!b.smear) smears.push(b.smear = { w, hue: hueOf(b.note, b.vel) | 0, start: now, end: null });
        if (yBot > 0) b.smear.x = x + w / 2 + (off ? off(0) : 0);
        else b.smear.end ??= now;
      }

      if (!fastGlow) bctx.shadowColor = colorOf(b.note, 60, 1, b.vel);
      bctx.fillStyle = colorOf(b.note, light, 0.92, b.vel);
      bctx.beginPath(); barPath(off, x, yTop, w, h, r); bctx.fill();

      // The bright core goes on after the glow, so the glow keeps the bar's colour
      const cw = w * 0.42;
      cores.push(off, x + (w - cw) / 2, yTop + r * 0.5, cw, Math.max(h - r, 1), cw / 2 * S.round, 0.16 + ve * 0.2);
    }
    bctx.shadowBlur = 0;
    if (fastGlow && S.glow > 0 && cores.length) glowBars();
    for (let i = 0; i < cores.length; i += 7) {
      bctx.fillStyle = `rgba(255,255,255,${cores[i + 6]})`;
      bctx.beginPath(); barPath(cores[i], cores[i + 1], cores[i + 2], cores[i + 3], cores[i + 4], cores[i + 5]); bctx.fill();
    }
    bctx.restore();

    // Bars cover the backdrop instead of adding to it, so nothing shows through them
    ctx.drawImage(barCanvas, 0, 0, W, H);

    // Impact glow + continuous sparks for held notes
    ctx.globalCompositeOperation = 'lighter';
    for (let n = LOW; n <= HIGH; n++) {
      const on = downBar[n];
      if (!on && flash[n] < 0.01) continue;
      if (modeAt(n) > 0) { // Off lights the key itself and nothing above it
        const g = keyGeo[n], cx = (g.x + g.w / 2) * ww;
        const power = (on ? 0.55 : 0) + flash[n] * 0.6;
        const rad = ww * (2.2 + flash[n] * 2.5) * (0.4 + S.glow);
        // One gradient per hue, one unit across; the transform places and sizes it
        const hue = Math.round(hueOf(n));
        ctx.fillStyle = gradient('note:' + hue, () => {
          const rg = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
          rg.addColorStop(0, `hsla(${hue}, 100%, 78%, 1)`);
          rg.addColorStop(0.3, `hsla(${hue}, 100%, 60%, 0.35)`);
          rg.addColorStop(1, 'hsla(0,0%,0%,0)');
          return rg;
        });
        ctx.globalAlpha = Math.min(1, power);
        ctx.setTransform(DPR * rad, 0, 0, DPR * rad, DPR * cx, DPR * keyTop);
        ctx.fillRect(-1, -1, 2, 1);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }
      flash[n] *= Math.pow(0.004, dt);
      if (on) burst(n, on.vel * 0.6, Math.floor(amount() * 5 * dt + Math.random()));
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles[i] = particles[particles.length - 1]; particles.pop(); continue; }
      p.vx += (Math.random() - 0.5) * 240 * S.pspread * S.pspeed * dt;
      p.vy *= Math.pow(0.35, dt);
      p.x += p.vx * dt; p.y += p.vy * dt;
      const a = p.life / p.max;
      const r = p.size * (0.4 + a * 0.6);
      // The smallest used to be squares; a slightly wider dot covers the same area
      const d = r * (r > 1.1 ? 1 : 1.128) * CELL / DOT;
      ctx.globalAlpha = a;
      ctx.drawImage(sprites, p.col * CELL, Math.min(TONES - 1, a * TONES | 0) * CELL, CELL, CELL, p.x - d / 2, p.y - d / 2, d, d);
    }
    ctx.globalAlpha = 1;
    drawSmears(now);
    ctx.globalCompositeOperation = 'source-over';

    // Keyboard
    if (kh > 1) {
      // Keys at rest share one gradient and one fill per colour; held keys are drawn singly
      const bh = kh * 0.63;
      const whiteKey = (x) => ctx.roundRect(x + 0.5, keyTop, ww - 1, kh, [0, 0, ww * 0.12, ww * 0.12]);
      const blackKey = (x, w) => ctx.roundRect(x, keyTop, w, bh, [0, 0, w * 0.15, w * 0.15]);
      const heldFill = (n, bottom, l0, l1) => {
        const kg = ctx.createLinearGradient(0, keyTop, 0, bottom);
        kg.addColorStop(0, colorOf(n, l0)); kg.addColorStop(1, colorOf(n, l1));
        ctx.fillStyle = kg;
        ctx.fill();
      };
      // Played keys take their note's colour. With notes Off they also glow, and fade out on release.
      const lightKeys = black => {
        for (let n = LOW; n <= HIGH; n++) {
          const off = modeAt(n) === 0, g = keyGeo[n], a = downBar[n] ? 1 : off ? flash[n] : 0;
          if (g.black !== black || a < 0.02) continue;
          ctx.globalAlpha = a;
          if (off) { ctx.shadowColor = colorOf(n, 60); ctx.shadowBlur = 45 * S.glow * DPR; }
          ctx.beginPath();
          if (black) { blackKey(g.x * ww, g.w * ww); heldFill(n, keyTop + bh, 50, 68); }
          else { whiteKey(g.x * ww); heldFill(n, H, 60, 82); }
        }
        ctx.globalAlpha = 1; ctx.shadowBlur = 0;
      };
      ctx.save(); ctx.beginPath(); ctx.rect(0, keyTop, W, kh); ctx.clip(); // the glow stays on the keys
      ctx.beginPath();
      for (let n = LOW; n <= HIGH; n++) if (!keyGeo[n].black && !downBar[n]) whiteKey(keyGeo[n].x * ww);
      ctx.fillStyle = gradient(`white:${keyTop}:${H}`, () => {
        const kg = ctx.createLinearGradient(0, keyTop, 0, H);
        kg.addColorStop(0, '#c9ccd6'); kg.addColorStop(0.12, '#f3f4f8'); kg.addColorStop(1, '#ffffff');
        return kg;
      });
      ctx.fill();
      lightKeys(false);
      ctx.beginPath();
      for (let n = LOW; n <= HIGH; n++) if (keyGeo[n].black && !downBar[n]) blackKey(keyGeo[n].x * ww, keyGeo[n].w * ww);
      ctx.fillStyle = gradient(`black:${keyTop}:${bh}`, () => {
        const kg = ctx.createLinearGradient(0, keyTop, 0, keyTop + bh);
        kg.addColorStop(0, '#0b0c11'); kg.addColorStop(0.85, '#23252f'); kg.addColorStop(1, '#0b0c11');
        return kg;
      });
      ctx.fill();
      lightKeys(true);
      ctx.restore();
      // Felt strip
      ctx.fillStyle = gradient(`strip:${S.hue}:${S.spread}:${W}`, () => {
        const strip = ctx.createLinearGradient(0, 0, W, 0);
        strip.addColorStop(0, `hsl(${S.hue}, 90%, 55%)`);
        strip.addColorStop(1, `hsl(${S.hue + S.spread}, 90%, 55%)`);
        return strip;
      });
      ctx.shadowColor = `hsl(${S.hue + S.spread / 2}, 100%, 60%)`;
      ctx.shadowBlur = 12 * S.glow * DPR;
      ctx.fillRect(0, keyTop - 2, W, 2);
      ctx.shadowBlur = 0;
    }

    // While Hue or Color spread is being dragged, the strip grows into a tall band: one slice per
    // key in the colour that key plays (or soft to loud, left to right, when colouring by velocity)
    peek += ((now < peekUntil ? 1 : 0) - peek) * (1 - Math.exp(-dt * 12));
    panel.classList.toggle('peek', now < peekUntil);
    if (peek > 0.01) {
      const band = peek * Math.max(48, H * 0.08), count = HIGH - LOW + 1;
      ctx.globalAlpha = Math.min(1, peek * 1.5);
      for (let i = 0; i < count; i++) {
        ctx.fillStyle = `hsl(${hueOf(LOW + i, i / (count - 1))}, 90%, 55%)`;
        ctx.fillRect(Math.floor(i * W / count), keyTop - band, Math.ceil(W / count) + 1, band);
      }
      ctx.globalAlpha = 1;
    }

    notesTick(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- UI chrome ----------
  const panel = document.getElementById('panel');
  const togglePanel = () => { panel.hidden = !panel.hidden; };
  const toggleFs = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  };
  document.getElementById('toggle').onclick = togglePanel;
  document.getElementById('fs').onclick = toggleFs;
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'n' || e.key === 'N') toggleNotes();
    if (e.key === 'm' || e.key === 'M') toggleClick();
    if (e.key === 'f' || e.key === 'F') toggleFs();
    if (e.key === 'h' || e.key === 'H') togglePanel();
    if (e.key === 'r' || e.key === 'R') randomize();
  });
  canvas.addEventListener('dblclick', e => { if (noteAt(e.clientX, e.clientY) == null) toggleFs(); });

  // Hide the UI and cursor when the mouse rests
  let idleTimer;
  const wake = () => {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if (!document.querySelector('.ui:hover, #notes:hover, #code:focus')) document.body.classList.add('idle');
    }, 3000);
  };
  addEventListener('pointermove', wake);
  addEventListener('pointerdown', wake);
  wake();

  // ---------- Click track ----------
  // A metronome, its first beat in each bar pitched higher. While it runs, the notes window's
  // bars follow it: bar 1 starts on its first click, and the page turns with it.
  const click = { ac: null, on: false, next: 0, beat: 0, timer: 0, t0: 0, key: '' };
  const clickKey = () => S.ctempo + ':' + S.cbeats;
  function tick(time, accent) {
    const ac = click.ac, o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = accent ? 1760 : 1175;
    g.gain.setValueAtTime(0, time);
    g.gain.linearRampToValueAtTime(S.cvol * (accent ? 0.9 : 0.5) + 0.0001, time + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.06);
    o.connect(g).connect(ac.destination);
    o.start(time); o.stop(time + 0.07);
  }
  // Clicks are booked a little ahead on the audio clock, so they keep time when the page is busy
  function bookClicks() {
    while (click.next < click.ac.currentTime + 0.12) {
      tick(click.next, click.beat % S.cbeats === 0);
      click.beat++;
      click.next += 60 / S.ctempo;
    }
  }
  async function startClick() {
    click.ac ||= new AudioContext();
    await click.ac.resume().catch(() => {});
    const ac = click.ac, lead = 0.1;
    click.next = ac.currentTime + lead; click.beat = 0;
    // When the first click is heard, on the page's clock, counting the trip to the speakers
    click.t0 = performance.now() + (lead + (ac.outputLatency || ac.baseLatency || 0)) * 1000;
    click.on = true; click.key = clickKey();
    clearInterval(click.timer);
    click.timer = setInterval(bookClicks, 25);
    bookClicks();
    clickBtn.textContent = 'Stop click';
    notesSettingsChanged();
  }
  function stopClick() {
    click.on = false;
    clearInterval(click.timer);
    clickBtn.textContent = 'Start click';
    notesSettingsChanged();
  }
  const toggleClick = () => click.on ? stopClick() : startClick();
  // A new tempo or meter counts in again from bar 1
  function clickSettingsChanged() { if (click.on && click.key !== clickKey()) startClick(); }
  const clickPair = document.createElement('div');
  clickPair.className = 'pair';
  clickPair.innerHTML = '<button title="Click track (M)">Start click</button>';
  const clickBtn = clickPair.firstChild;
  sections.Click.insertBefore(clickPair, sections.Click.children[1]);
  clickBtn.onclick = toggleClick;

  // ---------- Notes window ----------
  // Shows what is played (MIDI, pointer and microphone together) on a grand staff: either the
  // chord held now, with its name, or the notes written along a few bars in time.
  const LETTERS = 'CDEFGAB', LETTER_PC = [0, 2, 4, 5, 7, 9, 11];
  const ACC_TEXT = { '-2': '𝄫', '-1': '♭', 0: '', 1: '♯', 2: '𝄪' };
  // [letter, accidental] for each pitch class, when nothing better is known
  const PLAIN = [[0, 0], [0, 1], [1, 0], [2, -1], [2, 0], [3, 0], [3, 1], [4, 0], [4, 1], [5, 0], [6, -1], [6, 0]];
  // Major and dominant chords read better on flat roots (D♭, A♭), minor ones on sharp roots (C♯m, G♯m)
  const MAJOR_ROOT = [[0, 0], [1, -1], [1, 0], [2, -1], [2, 0], [3, 0], [3, 1], [4, 0], [5, -1], [5, 0], [6, -1], [6, 0]];
  // How many letters above the root each interval sits, so a chord spells as thirds
  const DEGREE = [0, 1, 1, 2, 2, 3, 4, 4, 4, 5, 6, 6];
  const CHORDS = [
    ['', [0, 4, 7]], ['m', [0, 3, 7], 1], ['°', [0, 3, 6], 1], ['+', [0, 4, 8]],
    ['sus4', [0, 5, 7]], ['sus2', [0, 2, 7]],
    ['7', [0, 4, 7, 10]], ['maj7', [0, 4, 7, 11]], ['m7', [0, 3, 7, 10], 1], ['m7♭5', [0, 3, 6, 10], 1],
    ['°7', [0, 3, 6, 9], 1, { 9: 6 }], ['m(maj7)', [0, 3, 7, 11], 1], ['7sus4', [0, 5, 7, 10]],
    ['6', [0, 4, 7, 9]], ['m6', [0, 3, 7, 9], 1], ['+7', [0, 4, 8, 10]],
    ['7', [0, 4, 10]], ['maj7', [0, 4, 11]], ['m7', [0, 3, 10], 1],
    ['add9', [0, 2, 4, 7]], ['m(add9)', [0, 2, 3, 7], 1], ['9', [0, 2, 4, 7, 10]], ['maj9', [0, 2, 4, 7, 11]],
    ['m9', [0, 2, 3, 7, 10], 1], ['7♭9', [0, 1, 4, 7, 10]], ['7♯9', [0, 3, 4, 7, 10], 0, { 3: 1 }],
    ['6/9', [0, 2, 4, 7, 9]], ['11', [0, 2, 5, 7, 10]], ['m11', [0, 2, 3, 5, 7, 10], 1],
    ['13', [0, 2, 4, 7, 9, 10]], ['9', [0, 2, 4, 10]], ['7♭9', [0, 1, 4, 10]], ['5', [0, 7], 0, null, 'Power chord'],
  ].map(([suffix, iv, minor, deg, sub = '']) => ({ suffix, minor, deg, sub, key: [...iv].sort((a, b) => a - b).join() }));
  const INTERVALS = ['Unison', 'Minor second', 'Major second', 'Minor third', 'Major third', 'Perfect fourth',
    'Tritone', 'Perfect fifth', 'Minor sixth', 'Major sixth', 'Minor seventh', 'Major seventh'];

  // A spelling is [letter, accidental]. Spell a note `iv` semitones above a spelled root.
  function above(root, iv, deg) {
    const letter = (root[0] + (deg?.[iv] ?? DEGREE[iv])) % 7;
    const pc = (LETTER_PC[root[0]] + root[1] + iv) % 12;
    let acc = ((pc - LETTER_PC[letter]) % 12 + 18) % 12 - 6;
    return Math.abs(acc) > 2 ? PLAIN[pc] : [letter, acc];
  }
  const pcName = sp => LETTERS[sp[0]] + ACC_TEXT[sp[1]];
  // Names the chord and gives a spelling for each pitch class in it
  function nameChord(notes) {
    const pcs = [...new Set(notes.map(n => n % 12))];
    const bass = notes[0] % 12;
    const spell = new Map(pcs.map(pc => [pc, PLAIN[pc]]));
    if (pcs.length === 1) return { name: pcName(PLAIN[bass]), sub: notes.length > 1 ? 'Octaves' : '', spell };
    if (pcs.length === 2) {
      // Two pitch classes: name the interval up from the bass, unless it is a doubled fifth (C5)
      const other = pcs.find(pc => pc !== bass), iv = (other - bass + 12) % 12;
      if (iv !== 7 || notes.length === 2) {
        spell.set(other, above(PLAIN[bass], iv));
        return { name: INTERVALS[iv], sub: '', spell, small: true };
      }
    }
    let best = null;
    for (const root of pcs) {
      const key = pcs.map(pc => (pc - root + 12) % 12).sort((a, b) => a - b).join();
      const i = CHORDS.findIndex(c => c.key === key);
      if (i < 0) continue;
      const score = i + (root === bass ? 0 : 100); // the chord read from the bass wins
      if (!best || score < best.score) best = { root, chord: CHORDS[i], score };
    }
    if (!best) return { name: '', sub: '', spell };
    const { root, chord } = best;
    const rsp = (chord.minor ? PLAIN : MAJOR_ROOT)[root];
    for (const pc of pcs) spell.set(pc, above(rsp, (pc - root + 12) % 12, chord.deg));
    let name = pcName(rsp) + chord.suffix;
    if (root !== bass) name += '/' + pcName(spell.get(bass));
    return { name, sub: chord.sub, spell };
  }

  // ---- Grand staff drawing ----
  // Steps count letters up from middle C (C4 = 0). Treble lines are E4..F5, bass lines G2..A3.
  // The box is the same height whatever is played, so the staff holds still: notes more than
  // two ledger lines off the staff are written an octave (or two) nearer, marked 8va or 8vb.
  const SP = 5, TT = 50, BT = 150, VH = 240, CLEF = 44;
  const stepOf = (n, sp) => (Math.floor((n - sp[1]) / 12) - 1) * 7 + sp[0] - 28;
  const yTreble = step => TT + (10 - step) * SP;
  const yBass = step => BT + (-2 - step) * SP;
  const svgLine = (x1, y1, x2, y2, w = 1, c = '#8a92a8') =>
    `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}"/>`;
  // The two staves, clefs, and a bar line at each x in `bars`
  function staffLines(w, bars = []) {
    let out = '';
    for (let k = 0; k < 5; k++) out += svgLine(8, TT + k * 2 * SP, w - 6, TT + k * 2 * SP) + svgLine(8, BT + k * 2 * SP, w - 6, BT + k * 2 * SP);
    out += svgLine(8, TT, 8, BT + 40, 1.4) + svgLine(w - 6, TT, w - 6, BT + 40, 1.4);
    for (const x of bars) out += svgLine(x, TT, x, BT + 40, 1);
    // Clefs from the music font, set so the G clef curls round G4 and the F clef's dots sit either side of F3
    out += `<text class="glyph" x="14" y="${yTreble(4) + 9}" font-size="40" fill="#c9cfdd">𝄞</text>`;
    out += `<text class="glyph" x="14" y="${yBass(-4) + 30}" font-size="44" fill="#c9cfdd">𝄢</text>`;
    return out;
  }
  // One chord at x = cx. `tail(n)`, if given, is the x where note n's held line ends.
  function chordAt(notes, spell, cx, tail) {
    let out = '';
    const groups = [
      { y: yTreble, ns: notes.filter(n => n >= 60), lines: [2, 10], up: true },
      { y: yBass, ns: notes.filter(n => n < 60), lines: [-10, -2], up: false },
    ];
    for (const g of groups) {
      if (!g.ns.length) continue;
      const pts = g.ns.map(n => ({ n, sp: spell.get(n % 12), step: stepOf(n, spell.get(n % 12)) }));
      let shift = 0;
      const far = () => g.up ? Math.max(...pts.map(p => p.step)) + shift > 15 : Math.min(...pts.map(p => p.step)) + shift < -15;
      while (far() && Math.abs(shift) < 14) shift += g.up ? -7 : 7;
      pts.forEach(p => p.step += shift);
      pts.sort((a, b) => a.step - b.step || a.n - b.n);
      // A second (or a shared line) can't stack: the upper note steps to the right
      let prev = null;
      for (const p of pts) { p.col = prev && prev.col === 0 && p.step - prev.step <= 1 ? 1 : 0; prev = p; }
      const shifted = pts.some(p => p.col);
      const [lo, hi] = g.lines, minS = pts[0].step, maxS = pts[pts.length - 1].step;
      const lx1 = cx - 10, lx2 = cx + 10 + (shifted ? 13 : 0);
      for (let s = lo - 2; s >= minS; s -= 2) out += svgLine(lx1, g.y(s), lx2, g.y(s), 1.2);
      for (let s = hi + 2; s <= maxS; s += 2) out += svgLine(lx1, g.y(s), lx2, g.y(s), 1.2);
      if (shift) {
        const label = Math.abs(shift) === 14 ? (g.up ? '15ma' : '15mb') : (g.up ? '8va' : '8vb');
        const y = g.up ? g.y(Math.max(maxS, 10)) - 8 : g.y(Math.min(minS, -10)) + 14;
        out += `<text x="${lx2 + 2}" y="${y}" font-size="9" font-style="italic" fill="#aab1c5">${label}</text>`;
      }
      // Accidentals, top down, each taking the nearest column clear of the ones above it
      const accCols = [];
      for (const p of [...pts].reverse()) {
        const acc = p.sp[1];
        if (!acc && pts.filter(q => q.step === p.step).length < 2) continue;
        let c = 0;
        while ((accCols[c] ||= []).some(s => Math.abs(s - p.step) < 6)) c++;
        accCols[c].push(p.step);
        out += `<text class="glyph" x="${cx - 9 - c * 10}" y="${g.y(p.step) + 4}" font-size="22" text-anchor="end" fill="#dfe3ee">${acc ? ACC_TEXT[acc] : '♮'}</text>`;
      }
      for (const p of pts) {
        const x = cx + p.col * 13, y = g.y(p.step), hue = hueOf(p.n);
        const end = tail?.(p.n);
        if (end > x + 6) out += `<rect x="${x}" y="${y - 1.6}" width="${end - x}" height="3.2" rx="1.6" fill="hsla(${hue}, 90%, 68%, .45)"/>`;
        out += `<ellipse cx="${x}" cy="${y}" rx="6" ry="4.3" transform="rotate(-20 ${x} ${y})"
          fill="hsl(${hue}, 90%, 68%)" stroke="#0a0c14" stroke-width=".6"/>`;
      }
    }
    return out;
  }
  const svgBox = (w, body) => `<svg viewBox="0 0 ${w} ${VH}" preserveAspectRatio="xMidYMid meet" role="img"
    aria-label="Grand staff">${body}</svg>`;
  const spelledName = (n, sp) => pcName(sp) + (Math.floor((n - sp[1]) / 12) - 1);

  // ---- Bars: notes written left to right in time ----
  // Time runs at the click track's tempo and meter, and each note lands on the nearest eighth
  // of a beat. A note past the last bar clears the page and starts it again at the left.
  // With the click running, bar 1 starts on its first click and the page turns with it, played
  // or not. Without it, the first note starts the clock, and after a whole page of silence the
  // next note starts over at bar 1.
  const BEAT_W = 40;
  const tr = { t0: null, page: 0, last: 0, events: [] }; // events: { beat, notes: Map(n -> { off }) }
  const beatMs = () => 60000 / S.ctempo, pageBeats = () => S.nbars * S.cbeats;
  const barsWidth = () => CLEF + pageBeats() * BEAT_W + 8;
  function recordOn(n, now) {
    if (!notesShown() || S.nshow !== 1) return;
    if (click.on) tr.t0 = click.t0;
    else if (tr.t0 == null || now - tr.last > pageBeats() * beatMs()) Object.assign(tr, { t0: now, page: 0, events: [] });
    const q = Math.max(0, Math.round((now - tr.t0) / beatMs() * 2) / 2);
    const page = Math.floor(q / pageBeats()), beat = q - page * pageBeats();
    if (page !== tr.page) { tr.page = page; tr.events = []; }
    let ev = tr.events.find(e => e.beat === beat);
    if (!ev) tr.events.push(ev = { beat, notes: new Map() });
    ev.notes.set(n, { off: null });
    tr.last = now;
  }
  function recordOff(n, now) {
    for (const ev of tr.events) { const e = ev.notes.get(n); if (e && e.off == null) e.off = now; }
  }
  const resetBars = () => Object.assign(tr, { t0: null, page: 0, events: [] });
  // Where in the page a moment falls, in beats; null once it is off this page
  function pageBeat(now) {
    if (tr.t0 == null) return null;
    const b = (now - tr.t0) / beatMs() - tr.page * pageBeats();
    return b >= 0 && b <= pageBeats() ? b : null;
  }
  const beatX = b => CLEF + 8 + b * BEAT_W;
  function drawBars(now) {
    const w = barsWidth(), bars = [];
    for (let i = 1; i < S.nbars; i++) bars.push(CLEF + i * S.cbeats * BEAT_W);
    let out = staffLines(w, bars);
    const pageEnd = beatX(pageBeats()) - 8;
    const rowEnds = [-Infinity, -Infinity]; // where each row of names ends, left to right
    for (const ev of tr.events) {
      const ns = [...ev.notes.keys()].sort((a, b) => a - b);
      const { name, spell } = nameChord(ns);
      const x = beatX(ev.beat);
      const tail = n => {
        const off = ev.notes.get(n).off ?? now;
        return Math.min(pageEnd, beatX((off - tr.t0) / beatMs() - tr.page * pageBeats()));
      };
      out += chordAt(ns, spell, x, tail);
      if (S.nnames) {
        // A chord by its name, anything else by its notes. A label that would run into the one
        // before it drops to a second row.
        const isChord = name && new Set(ns.map(n => n % 12)).size > 2;
        const label = isChord ? name : [...new Set(ns.map(n => pcName(spell.get(n % 12))))].join(' ');
        const half = label.length * 2.9 + 2;
        const row = rowEnds[0] <= x - half ? 0 : rowEnds[1] <= x - half ? 1 : 0;
        rowEnds[row] = x + half;
        out += `<text x="${x}" y="${11 + row * 11}" font-size="10" text-anchor="middle"
          fill="${isChord ? '#eef1f8' : '#aab1c5'}">${label}</text>`;
      }
    }
    const b = pageBeat(now);
    if (b != null && (click.on || now - tr.last < pageBeats() * beatMs()))
      out += svgLine(beatX(b), TT - 14, beatX(b), BT + 54, 1, 'rgba(142, 162, 255, .5)');
    return svgBox(w, out);
  }

  // ---- The window ----
  // A see-through box over the visualizer. Drag it anywhere, resize it from its corner.
  const notesFrame = document.getElementById('notes'), nview = document.getElementById('nview');
  const [chordEl, namesEl, staffEl] = nview.children;
  const NOTES_STORE = 'rach-viz-notes';
  let notesUi = { on: false };
  try { notesUi = { ...notesUi, ...JSON.parse(localStorage.getItem(NOTES_STORE) || '{}') }; } catch {}
  const saveNotesUi = () => { try { localStorage.setItem(NOTES_STORE, JSON.stringify(notesUi)); } catch {} };
  const notesShown = () => !notesFrame.hidden;
  let shownKey = null, pending = false, lastDraw = 0;

  const heldNotes = () => [...new Set([...held.values()].map(b => b.note))].sort((a, b) => a - b);
  function renderNotes() {
    pending = false;
    if (!notesShown()) return;
    if (S.nshow === 1) { staffEl.innerHTML = drawBars(performance.now()); lastDraw = performance.now(); return; }
    const notes = heldNotes();
    // With every key up, the last chord stays, dimmed, until the next one
    nview.classList.toggle('faded', !notes.length && shownKey !== null);
    if (!notes.length) {
      if (shownKey === null) { chordEl.textContent = ''; namesEl.textContent = 'Play something'; staffEl.innerHTML = svgBox(220, staffLines(220)); }
      return;
    }
    const key = notes.join();
    if (key === shownKey) return;
    shownKey = key;
    const { name, sub, spell, small } = nameChord(notes);
    chordEl.innerHTML = `<span${small ? ' class="small"' : ''}></span>`;
    chordEl.firstChild.textContent = name || '—';
    namesEl.textContent = (sub ? sub + ' · ' : '') + notes.map(n => spelledName(n, spell.get(n % 12))).join('  ');
    staffEl.innerHTML = svgBox(220, staffLines(220) + chordAt(notes, spell, 132));
  }
  // Notes often change several at once (a chord, or a re-struck key); draw once for all of them
  function notesChanged(n, on) {
    if (!notesShown()) return;
    if (n != null) (on ? recordOn : recordOff)(n, performance.now());
    if (pending) return;
    pending = true;
    queueMicrotask(renderNotes);
  }
  // Bars move with time: redraw while the playhead runs or a held note's line grows
  function notesTick(now) {
    if (!notesShown() || S.nshow !== 1 || now - lastDraw < 40) return;
    if (click.on) {
      // The page turns with the click
      const page = Math.floor(Math.max(0, now - click.t0) / beatMs() / pageBeats());
      if (page !== tr.page) { tr.page = page; tr.events = []; }
      return renderNotes();
    }
    if (held.size || (tr.t0 != null && now - tr.last < pageBeats() * beatMs() + 200)) renderNotes();
  }
  // Called whenever a control moves
  function notesSettingsChanged() {
    document.documentElement.style.setProperty('--panel-a', S.popacity);
    document.documentElement.style.setProperty('--notes-a', S.nopacity);
    nview.classList.toggle('bars', S.nshow === 1);
    nview.classList.toggle('nonames', !S.nnames);
    const key = [S.nshow, S.nbars, S.cbeats, S.ctempo, click.on && click.t0].join();
    if (key !== notesSettingsChanged.key) {
      notesSettingsChanged.key = key; resetBars();
      if (click.on) tr.t0 = click.t0;
    }
    shownKey = null;
    nview.classList.remove('faded');
    renderNotes();
  }

  // Position and size, kept inside the window
  function placeNotes() {
    const r = notesUi;
    if (r.w) { notesFrame.style.width = Math.min(r.w, innerWidth - 8) + 'px'; notesFrame.style.height = Math.min(r.h, innerHeight - 8) + 'px'; }
    if (r.x != null) {
      notesFrame.style.left = Math.max(0, Math.min(r.x, innerWidth - notesFrame.offsetWidth)) + 'px';
      notesFrame.style.top = Math.max(0, Math.min(r.y, innerHeight - notesFrame.offsetHeight)) + 'px';
    }
  }
  function setNotes(on) {
    notesUi.on = on; saveNotesUi();
    notesFrame.hidden = !on;
    if (on) { placeNotes(); notesSettingsChanged(); }
  }
  const toggleNotes = () => setNotes(!notesUi.on);
  document.getElementById('notesBtn').onclick = toggleNotes;
  document.getElementById('notesClose').onclick = () => setNotes(false);
  addEventListener('resize', () => { if (notesShown()) placeNotes(); });
  new ResizeObserver(() => {
    if (!notesShown()) return;
    notesUi.w = notesFrame.offsetWidth; notesUi.h = notesFrame.offsetHeight; saveNotesUi();
  }).observe(notesFrame);
  {
    let grab = null;
    notesFrame.addEventListener('pointerdown', e => {
      const r = notesFrame.getBoundingClientRect();
      // the close button, and the corner that resizes, keep their own jobs
      if (e.target.closest('button') || (e.clientX > r.right - 20 && e.clientY > r.bottom - 20)) return;
      grab = { dx: e.clientX - r.left, dy: e.clientY - r.top };
      notesFrame.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    notesFrame.addEventListener('pointermove', e => {
      if (!grab) return;
      notesUi.x = e.clientX - grab.dx; notesUi.y = e.clientY - grab.dy;
      placeNotes();
    });
    const drop = () => { if (grab) { grab = null; notesUi.x = notesFrame.offsetLeft; notesUi.y = notesFrame.offsetTop; saveNotesUi(); } };
    notesFrame.addEventListener('pointerup', drop);
    notesFrame.addEventListener('pointercancel', drop);
  }
  notesSettingsChanged();
  if (notesUi.on) setNotes(true);

  // Keep the screen awake while playing
  const lock = () => navigator.wakeLock?.request('screen').catch(() => {});
  lock();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') lock(); });

  window.viz = { noteOn, noteOff, held };
})();
</script>
</body>
</html>
