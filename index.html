<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rachmaninoff Visualizer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Music&display=swap">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
  body { font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: #dfe3ee; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  body.idle { cursor: none; }

  .ui { transition: opacity .4s; }
  body.idle .ui { opacity: 0; pointer-events: none; }

  #bar {
    position: fixed; top: 14px; right: 14px; display: flex; gap: 8px; align-items: center;
  }
  #status {
    display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px;
    background: rgba(18, 20, 30, .85); border: 1px solid rgba(255, 255, 255, .08);
    max-width: 46vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #666; }
  #dot.on { background: #4ade80; box-shadow: 0 0 10px #4ade80; }
  #dot.err { background: #f87171; }

  button {
    font: inherit; color: inherit; cursor: pointer; padding: 7px 12px; border-radius: 999px;
    background: rgba(18, 20, 30, .85); border: 1px solid rgba(255, 255, 255, .08);
  }
  button:hover { background: rgba(40, 44, 62, .92); }

  #panel {
    position: fixed; top: 60px; right: 14px; width: max-content; max-width: calc(100vw - 28px); padding: 14px 16px 12px;
    border-radius: 16px; background: rgba(18, 20, 30, var(--panel-a, .85)); border: 1px solid rgba(255, 255, 255, .08);
    max-height: calc(100vh - 74px); overflow-y: auto;
  }
  #panel[hidden] { display: none; }
  /* While Hue or Color spread is in hand, everything but those two sliders clears out of the way */
  #panel, #panel details > * { transition: opacity .2s, background-color .2s, border-color .2s, box-shadow .2s; }
  #panel.peek { background-color: transparent; border-color: transparent; }
  #panel.peek details > :not(.live) { opacity: 0; }
  #panel.peek .live { background-color: rgba(18, 20, 30, .85); box-shadow: 0 0 0 8px rgba(18, 20, 30, .85); border-radius: 4px; }
  /* A column per group of sections; they wrap when the window is narrow. A column whose sections
     are all closed is only as wide as its headings, so the panel shrinks around what is open. */
  #rows { display: flex; flex-wrap: wrap; gap: 0 22px; align-items: flex-start; }
  #rows > div { width: 215px; }
  #rows > div:not(:has(details[open])) { width: auto; }
  @media (max-width: 520px) {
    #panel:has(details[open]) { width: calc(100vw - 28px); }
    #rows > div:has(details[open]) { width: 100%; }
  }
  details { margin-bottom: 10px; min-width: 0; }
  details:not([open]) summary { margin-bottom: 0; }
  summary {
    cursor: pointer; margin-bottom: 10px; color: #dfe3ee; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase; font-size: 11px;
  }
  .row { margin-bottom: 10px; }
  .row label { display: flex; justify-content: space-between; margin-bottom: 3px; color: #aab1c5; }
  .row output { color: #6f778d; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; margin: 0; accent-color: #8ea2ff; }
  /* A choice with many named options: every option is a chip, so all of them can be read at once */
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
  .chips label { position: relative; cursor: pointer; }
  .chips input { position: absolute; opacity: 0; pointer-events: none; }
  .chips span {
    display: block; padding: 4px 10px; border-radius: 999px; font-size: 12px; color: #aab1c5;
    background: rgba(0, 0, 0, .3); border: 1px solid rgba(255, 255, 255, .08);
  }
  .chips label:hover span { background: rgba(40, 44, 62, .92); }
  .chips input:checked + span { background: #8ea2ff; border-color: #8ea2ff; color: #0b0d16; }
  .chips input:focus-visible + span { outline: 2px solid #8ea2ff; outline-offset: 2px; }
  .chips .tag { flex-basis: 100%; color: #aab1c5; }
  #hear { margin: 2px 0 10px; color: #6f778d; min-height: 1.4em; }
  .pair { display: flex; gap: 6px; margin-bottom: 6px; }
  .pair > * { flex: 1; min-width: 0; }
  .pair > #load { flex: none; }
  input[type=text] {
    font: inherit; color: inherit; padding: 7px 12px; border-radius: 999px;
    background: rgba(0, 0, 0, .3); border: 1px solid rgba(255, 255, 255, .08); outline: none;
  }
  input[type=text]:focus { border-color: #8ea2ff; }

  /* Notes window: what is being played, on a grand staff. A see-through box with no title bar:
     drag it anywhere, resize it from its corner. It stays up while the rest of the UI hides. */
  #notes {
    position: fixed; left: 14px; top: 60px; width: 380px; height: 260px; min-width: 160px; min-height: 110px;
    display: flex; flex-direction: column; overflow: hidden; resize: both; border-radius: 12px; cursor: move;
    background: rgba(10, 12, 20, var(--notes-a, .6)); border: 1px solid transparent;
    user-select: none; touch-action: none; transition: border-color .3s;
  }
  #notes[hidden] { display: none; }
  #notes:hover { border-color: rgba(255, 255, 255, .14); }
  #notesClose {
    position: absolute; top: 4px; right: 4px; z-index: 1; padding: 1px 7px; font-size: 12px;
    background: rgba(18, 20, 30, .85); opacity: 0; transition: opacity .2s;
  }
  #notes:hover #notesClose { opacity: 1; }
  body.idle #notes { border-color: transparent; }
  body.idle #notesClose { opacity: 0; }
  .nview {
    flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 6px 12px 8px;
    container-type: size; transition: opacity .3s;
  }
  .nview.faded { opacity: .4; }
  /* Fixed heights, so the staff below holds its size whatever the names say */
  .nview .chord {
    flex: none; height: clamp(20px, 15cqh, 84px); display: flex; align-items: center; justify-content: center;
    font-weight: 600; color: #eef1f8; font-size: clamp(16px, 12cqh, 72px); white-space: nowrap; overflow: hidden;
  }
  .nview .chord .small { font-size: .6em; }
  .nview .names {
    flex: none; height: clamp(15px, 8cqh, 30px); text-align: center; color: #8a92a8; font-size: clamp(11px, 5.5cqh, 22px);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums;
  }
  .nview.bars .chord, .nview.bars .names, .nview.nonames .chord, .nview.nonames .names { display: none; }
  .nview .staff { flex: 1; min-height: 0; }
  .nview svg { display: block; width: 100%; height: 100%; }
  .nview .glyph { font-family: "Noto Music", "Bravura", "Segoe UI Symbol", "Apple Symbols", "Noto Sans Symbols 2", serif; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="bar" class="ui">
  <div id="status"><span id="dot"></span><span id="statusText">Looking for MIDI…</span></div>
  <button id="notesBtn" title="Notes window (N)">Notes</button>
  <button id="toggle" title="Controls (H)">Controls</button>
  <button id="fs" title="Fullscreen (F)">Fullscreen</button>
</div>

<div id="panel" class="ui">
  <div id="rows"></div>
  <details id="presets" open>
    <summary>Presets</summary>
    <div class="pair">
      <button id="copyLink">Copy link</button>
      <button id="copyCode">Copy code</button>
    </div>
    <div class="pair">
      <input id="code" type="text" placeholder="Paste code or link" spellcheck="false" autocomplete="off">
      <button id="load">Load</button>
    </div>
    <div class="pair">
      <button id="random" title="Randomize (R)">Randomize</button>
      <button id="reset">Reset</button>
    </div>
  </details>
</div>

<div id="notes" hidden role="region" aria-label="Notes">
  <button id="notesClose" title="Close (N)" aria-label="Close notes">✕</button>
  <div class="nview" id="nview" aria-live="polite">
    <div class="chord"></div>
    <div class="names"></div>
    <div class="staff"></div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ---------- Settings ----------
  // MIDI and the microphone each pick their own mode. A mode's sliders show while either source
  // that is playing uses it; the microphone counts only while it is listening.
  let micOn = false;
  const uses = (...ms) => ms.includes(S.nmode) || (micOn && ms.includes(S.mmode));
  const NOTE_MODES = ['Off', 'Note visualizer', 'Wireframe', 'Thunder'];
  const GROUPS = [
    { title: 'Keyboard', controls: [
      // What a played note sends up the screen: nothing (the keys alone light up), a bar, a
      // wire that runs to the backdrop and colours it, or nothing from the key but a cloud of
      // colour lit up somewhere behind. Each mode shows only the sliders it uses.
      { key: 'nmode',     label: 'MIDI',            min: 0,    max: 3,   step: 1,    def: 1, choice: true, tag: true, names: NOTE_MODES },
      { key: 'mmode',     label: 'Microphone',      min: 0,    max: 3,   step: 1,    def: 1, choice: true, tag: true, names: NOTE_MODES },
      { key: 'speed',     label: 'Speed',           min: 0.05, max: 1.5, step: 0.01, def: 0.35, when: () => uses(1, 2) },
      { key: 'width',     label: 'Note width',      min: 0.2,  max: 1,   step: 0.01, def: 0.8,  when: () => uses(1, 2) },
      { key: 'round',     label: 'Roundness',       min: 0,    max: 1,   step: 0.01, def: 0.5,  when: () => uses(1) },
      { key: 'wiggle',    label: 'Wiggle',          min: 0,    max: 1,   step: 0.01, def: 0,    when: () => uses(1) },
      { key: 'topacity',  label: 'Cloud opacity',   min: 0,    max: 1,   step: 0.01, def: 0.7,  when: () => uses(3) },
      { key: 'tbright',   label: 'Cloud brightness', min: 0,   max: 1,   step: 0.01, def: 0.6,  when: () => uses(3) },
      { key: 'tsize',     label: 'Cloud size',      min: 0.3,  max: 2,   step: 0.01, def: 1,    when: () => uses(3) },
      { key: 'tfade',     label: 'Cloud fade',      min: 0.5,  max: 10,  step: 0.1,  def: 3,    when: () => uses(3) },
      { key: 'glow',      label: 'Glow',            min: 0,    max: 1,   step: 0.01, def: 0.6 },
      { key: 'vsens',     label: 'Velocity sensitivity', min: 0, max: 1, step: 0.01, def: 0.5,  when: () => uses(1, 2, 3) },
      { key: 'hue',       label: 'Hue',             min: 0,    max: 360, step: 1,    def: 215 },
      { key: 'spread',    label: 'Color spread',    min: 0,    max: 360, step: 1,    def: 110 },
      { key: 'cmode',     label: 'Color by',        min: 0,    max: 2,   step: 1,    def: 0, names: ['Pitch', 'Pitch class', 'Velocity'], when: () => uses(1, 2, 3) },
      { key: 'keys',      label: 'Keyboard height', min: 0,    max: 0.3, step: 0.005, def: 0.16 },
    ] },
    // Pitches heard by the microphone play the visualizer like keys
    { title: 'Microphone', controls: [
      { key: 'mdetect',   label: 'Listen for',      min: 0,    max: 1,   step: 1,    def: 1, names: ['One note', 'Chords'] },
      { key: 'msens',     label: 'Sensitivity',     min: 0,    max: 1,   step: 0.01, def: 0.5 },
    ] },
    { title: 'Particles', controls: [
      { key: 'particles', label: 'Amount',          min: 0,    max: 1,   step: 0.01, def: 0.4 },
      { key: 'pspeed',    label: 'Speed',           min: 0.2,  max: 3,   step: 0.01, def: 1 },
      { key: 'pspread',   label: 'Spread',          min: 0,    max: 3,   step: 0.01, def: 1 },
      { key: 'psize',     label: 'Size',            min: 0.3,  max: 3,   step: 0.01, def: 1 },
      { key: 'plife',     label: 'Lifetime',        min: 0.3,  max: 3,   step: 0.01, def: 1 },
      { key: 'shed',      label: 'Note shedding',   min: 0,    max: 1,   step: 0.01, def: 0.4, when: () => uses(1) },
    ] },
    { title: 'Geometry', controls: [
      // New shapes go on the end: a preset stores the shape as its place in this list
      { key: 'gshape',    label: 'Shape',           min: 0,    max: 12,  step: 1,    def: 0, choice: true,
        names: ['Star weave', 'Lotus', 'Lattice', 'Flower of Life', "Metatron's Cube", 'Mystic Rose', 'Torus',
          'Phyllotaxis', 'Spirograph', 'Circle of fifths', 'Platonic solids', 'Penrose tiling', 'Girih star'] },
      { key: 'gcomplex',  label: 'Complexity',      min: 1,    max: 10,  step: 1,    def: 5 },
      { key: 'gsize',     label: 'Size',            min: 0.3,  max: 2,   step: 0.01, def: 1 },
      { key: 'gline',     label: 'Line weight',     min: 0.3,  max: 4,   step: 0.05, def: 1 },
      { key: 'gspin',     label: 'Spin',            min: -3,   max: 3,   step: 0.01, def: 0.4 },
      { key: 'gopacity',  label: 'Opacity',         min: 0,    max: 1,   step: 0.01, def: 0.35 },
      { key: 'gsat',      label: 'Saturation',      min: 0,    max: 1,   step: 0.01, def: 0.8, when: () => uses(0, 1, 3) },
    ] },
    // In Wireframe mode the figure is there in grey (unless Geometry appears is When played,
    // which leaves only the colour the notes bring), and Draw speed and Fade time set
    // how fast colour runs along its wires and how long it stays. Spread time is how long the
    // colour keeps running after a wire lands, however short the note was.
    { title: 'Reaction', controls: [
      { key: 'greveal',   label: 'Geometry appears', min: 0,   max: 1,   step: 1,    def: 0, names: ['Always', 'When played'] },
      { key: 'gdraw',     label: 'Draw speed',      min: 0.2,  max: 4,   step: 0.05, def: 1, when: () => S.greveal === 1 || uses(2) },
      { key: 'gfade',     label: 'Fade time',       min: 0.2,  max: 4,   step: 0.05, def: 1, when: () => S.greveal === 1 || uses(2) },
      { key: 'gspread',   label: 'Spread time',     min: 0.2,  max: 8,   step: 0.1,  def: 2.5, when: () => uses(2) },
      { key: 'ghold',     label: 'Held notes',      min: 0,    max: 1,   step: 1,    def: 1, names: ['Stop spreading', 'Keep spreading'], when: () => uses(2) },
      // Small effects on the coloured threads, strongest while they are still being drawn
      { key: 'gshimmer',  label: 'Shimmer',         min: 0,    max: 1,   step: 0.01, def: 0.3,  when: () => uses(2) },
      { key: 'gelectric', label: 'Electric',        min: 0,    max: 1,   step: 0.01, def: 0,    when: () => uses(2) },
      { key: 'gsparks',   label: 'Sparks',          min: 0,    max: 1,   step: 0.01, def: 0.25, when: () => uses(2) },
      { key: 'greact',    label: 'Play response',   min: 0,    max: 1,   step: 0.01, def: 0.4 },
    ] },
    { title: 'Weather', controls: [
      { key: 'weather',   label: 'Kind',            min: 0,    max: 2,   step: 1,    def: 0, names: ['Off', 'Rain', 'Snow'] },
      { key: 'wamount',   label: 'Amount',          min: 0.05, max: 1,   step: 0.01, def: 0.5, when: () => S.weather > 0 },
      { key: 'wwind',     label: 'Wind',            min: -1,   max: 1,   step: 0.01, def: 0,   when: () => S.weather > 0 },
      { key: 'wspeed',    label: 'Fall speed',      min: 0.3,  max: 3,   step: 0.01, def: 1,   when: () => S.weather > 0 },
    ] },
    // How the two boxes look, and what the notes window shows. These belong to this screen,
    // so presets and Randomize leave them alone.
    { title: 'Windows', controls: [
      { key: 'popacity',  label: 'Controls opacity', min: 0,   max: 1,   step: 0.01, def: 0.85, local: true },
      { key: 'nopacity',  label: 'Notes opacity',   min: 0,    max: 1,   step: 0.01, def: 0.6,  local: true },
      { key: 'nshow',     label: 'Notes show',      min: 0,    max: 1,   step: 1,    def: 1, names: ['Chord', 'Bars'], local: true },
      { key: 'nnames',    label: 'Note names',      min: 0,    max: 1,   step: 1,    def: 1, names: ['Hide', 'Show'], local: true },
      { key: 'nbars',     label: 'Bars',            min: 1,    max: 8,   step: 1,    def: 4,  local: true, when: () => S.nshow === 1 },
    ] },
    // A metronome. The notes window's bars take their tempo and meter from here.
    { title: 'Click', controls: [
      { key: 'ctempo',    label: 'Tempo (BPM)',     min: 40,   max: 220, step: 1,    def: 90, local: true },
      { key: 'cbeats',    label: 'Beats per bar',   min: 2,    max: 7,   step: 1,    def: 4,  local: true },
      { key: 'cvol',      label: 'Volume',          min: 0,    max: 1,   step: 0.01, def: 0.6, local: true },
    ] },
    { title: 'Image', controls: [
      { key: 'iopacity',  label: 'Opacity',         min: 0,    max: 1,   step: 0.01, def: 0.5 },
      { key: 'iblur',     label: 'Blur',            min: 0,    max: 1,   step: 0.01, def: 0 },
      { key: 'idim',      label: 'Dim',             min: 0,    max: 1,   step: 0.01, def: 0 },
    ] },
  ];
  const CONTROLS = GROUPS.flatMap(g => g.controls);
  const STORE = 'rach-viz-settings';
  const S = {};
  CONTROLS.forEach(c => S[c.key] = c.def);
  try { Object.assign(S, JSON.parse(localStorage.getItem(STORE) || '{}')); } catch {}
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch {} };

  const rows = document.getElementById('rows');
  const inputs = {}, sections = { Presets: document.getElementById('presets') };
  const changed = () => { save(); dropHash(); syncRows(); clickSettingsChanged(); notesSettingsChanged(); };
  let peekUntil = 0, peek = 0; // when the tall colour band should stand until, and how far up it is (0..1)
  for (const g of GROUPS) {
    const section = sections[g.title] = document.createElement('details');
    section.open = true;
    section.innerHTML = `<summary>${g.title}</summary>`;
    for (const c of g.controls) {
      const row = document.createElement('div');
      let set; // takes any number, keeps the nearest value the control allows
      if (c.choice) {
        row.className = 'chips';
        row.setAttribute('role', 'radiogroup');
        row.setAttribute('aria-label', c.label);
        row.innerHTML = (c.tag ? `<div class="tag">${c.label}</div>` : '') + c.names.map((name, i) =>
          `<label><input type="radio" name="${c.key}" value="${i}"><span>${name}</span></label>`).join('');
        const radios = [...row.querySelectorAll('input')];
        set = v => {
          S[c.key] = Math.min(c.max, Math.max(c.min, Math.round(v) || 0));
          radios[S[c.key]].checked = true;
        };
        row.addEventListener('change', e => { S[c.key] = +e.target.value; changed(); });
      } else {
        row.className = 'row';
        row.innerHTML = `<label><span>${c.label}</span><output></output></label>
          <input type="range" min="${c.min}" max="${c.max}" step="${c.step}">`;
        const input = row.querySelector('input'), out = row.querySelector('output');
        const show = () => out.textContent = c.names ? c.names[+input.value] : (+input.value).toFixed(c.step < 1 ? 2 : 0);
        // the range input clamps and snaps to its step
        set = v => { input.value = v; S[c.key] = +input.value; show(); };
        input.addEventListener('input', () => { S[c.key] = +input.value; show(); changed(); });
        if (c.key === 'hue' || c.key === 'spread') {
          // The colour band above the keys stands tall while either slider is in hand
          row.classList.add('live');
          const hold = () => { peekUntil = Infinity; };
          const letGo = () => { peekUntil = performance.now() + 900; };
          input.addEventListener('pointerdown', hold);
          input.addEventListener('input', () => { if (peekUntil !== Infinity) letGo(); });
          for (const type of ['pointerup', 'pointercancel', 'change', 'blur']) input.addEventListener(type, letGo);
        }
      }
      set(S[c.key]);
      inputs[c.key] = { set, row };
      section.appendChild(row);
    }
  }
  // Short sections share a column
  for (const titles of [['Keyboard'], ['Microphone', 'Particles', 'Weather', 'Windows'], ['Geometry', 'Click'], ['Reaction', 'Image', 'Presets']]) {
    const col = document.createElement('div');
    rows.appendChild(col);
    col.append(...titles.map(t => sections[t]));
  }
  // Some sliders only apply in one mode; show them only then
  function syncRows() { for (const c of CONTROLS) if (c.when) inputs[c.key].row.hidden = !c.when(); }
  syncRows();
  document.getElementById('reset').onclick = () => {
    for (const c of CONTROLS) inputs[c.key].set(c.def);
    changed();
  };
  // Every control gets a uniform random value from its own range
  const randomize = () => {
    for (const c of CONTROLS) if (!c.local) inputs[c.key].set(c.min + Math.random() * (c.max - c.min));
    changed();
  };
  document.getElementById('random').onclick = randomize;

  // ---------- Background image ----------
  // An uploaded picture sits behind everything above the keyboard. It is scaled down once,
  // kept in this browser only, and is not part of a preset.
  const IMG_STORE = 'rach-viz-image', IMG_MAX = 2560;
  let bgImage = null; // a canvas holding the picture, or null
  // Blur and Dim are baked into a second copy, redone only when a slider or the picture changes.
  // A blurred picture holds no fine detail, so the copy is small and the blur on it is cheap.
  let bgBaked = null, bakedFor = '';
  function shownImage() {
    if (!S.iblur && !S.idim) return bgImage;
    const key = S.iblur + ':' + S.idim;
    if (key !== bakedFor) {
      bakedFor = key;
      const sigma = S.iblur * 0.025 * Math.max(bgImage.width, bgImage.height);
      const k = Math.max(1, sigma / 2.5);
      bgBaked ||= document.createElement('canvas');
      const w = bgBaked.width = Math.ceil(bgImage.width / k), h = bgBaked.height = Math.ceil(bgImage.height / k);
      const c = bgBaked.getContext('2d');
      // Drawn a little oversize, so the blur has picture to pull from at the edges
      const pad = sigma ? Math.ceil(2 * sigma / k) : 0;
      if (fastGlow && sigma) c.filter = `blur(${sigma / k}px)`;
      c.drawImage(bgImage, -pad, -pad, w + 2 * pad, h + 2 * pad);
      c.filter = 'none';
      if (S.idim) { c.fillStyle = `rgba(0, 0, 0, ${S.idim})`; c.fillRect(0, 0, w, h); }
    }
    return bgBaked;
  }
  {
    const pair = document.createElement('div');
    pair.className = 'pair';
    pair.innerHTML = `<button>Upload image</button><button hidden>Remove</button>
      <input type="file" accept="image/*" hidden>`;
    const [uploadBtn, removeBtn, file] = pair.children;
    sections.Image.insertBefore(pair, sections.Image.children[1]);
    const show = img => {
      const k = Math.min(1, IMG_MAX / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * k));

      bgImage = c; bakedFor = ''; removeBtn.hidden = false;
      return c;
    };

      const img = new Image();
      img.onload = () => then(show(img));
      img.onerror = () => then(null);
      img.src = url;
    };

      const f = file.files[0];

  function drawImage(keyTop) {

      if (raw == null || !Number.isFinite(v)) continue;

  // ---------- Keyboard geometry ----------
  const LOW = 21, HIGH = 108, WHITES = 52;
  const isBlack = n => [1, 3, 6, 8, 10].includes(n % 12);
  const keyGeo = []; // per note: { x, w, black } in units of white-key widths
  {
    let wi = 0;

      if (isBlack(n)) keyGeo[n] = { x: wi - 0.3, w: 0.6, black: true };
      else { keyGeo[n] = { x: wi, w: 1, black: false }; wi++; }
    }
  }

  // ---------- Canvas ----------
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  // Bars render to their own layer: they glow additively against each other, then cover the backdrop
  const barCanvas = document.createElement('canvas');
  const bctx = barCanvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    barCanvas.height = canvas.height = Math.round(H * DPR);
  }
  addEventListener('resize', resize);
  resize();

  // Browsers without canvas filters fall back to a shadow per bar.

  const gctx = glowCanvas.getContext('2d');
  function glowBars() {
    const sigma = S.glow * 17; // CSS pixels, the same spread as shadowBlur = glow * 34
    const k = sigma > 6 ? 4 : 2; // a wide blur hides a coarser copy
    const gw = Math.ceil(W / k), gh = Math.ceil(H / k);
    if (glowCanvas.width !== gw || glowCanvas.height !== gh) { glowCanvas.width = gw; glowCanvas.height = gh; }
    else gctx.clearRect(0, 0, gw, gh);
    gctx.filter = `blur(${sigma / k}px)`;
    gctx.drawImage(barCanvas, 0, 0, W / k, H / k);
    bctx.drawImage(glowCanvas, 0, 0, gw * k, gh * k);
  }

  // Gradients are built once and reused until the value they were built from changes
  const gradients = new Map();
  function gradient(key, make) {
    let g = gradients.get(key);

      if (gradients.size > 600) gradients.clear();
      gradients.set(key, g = make());
    }
    return g;
  }

  // Particles are stamped from a sheet of pre-drawn dots: a column per hue, a row per brightness
  const HUES = 72, TONES = 4, CELL = 32, DOT = 14;
  const sprites = document.createElement('canvas');
  {
    sprites.width = HUES * CELL; sprites.height = TONES * CELL;
    const sc = sprites.getContext('2d');
    for (let h = 0; h < HUES; h++) for (let t = 0; t < TONES; t++) {
      sc.fillStyle = `hsl(${h * 360 / HUES}, 100%, ${65 + 25 * (t + 0.5) / TONES}%)`;
      sc.beginPath(); sc.arc((h + 0.5) * CELL, (t + 0.5) * CELL, DOT, 0, Math.PI * 2); sc.fill();
    }

  const spriteCol = hue => Math.round(((hue % 360) + 360) % 360 * HUES / 360) % HUES;

  // ---------- Note state ----------
  const held = new Map();   // note -> bar
  const bars = [];          // { note, vel, start, end|null }
  const particles = [];
  const flash = new Float32Array(128);

  const lastVel = new Float32Array(128).fill(0.8); // how hard each key was last struck
  // Color by: place on the keyboard, place on the circle of fifths (so octaves match and
  // related notes sit close), or how hard the note was struck
  const hueOf = (n, vel = lastVel[n]) => (S.hue + S.spread *
    (S.cmode === 1 ? (n * 7 % 12) / 12 : S.cmode === 2 ? vel : (n - LOW) / (HIGH - LOW))) % 360;
  const colorOf = (n, l = 62, a = 1, vel) => `hsla(${hueOf(n, vel)}, 95%, ${keyGeo[n].black ? l - 10 : l}%, ${a})`;
  // Velocity sensitivity: how far a strike's force shows in its bar. 0.5 is the plain response,
  // 0 makes every note look alike, and past 0.5 hard notes also grow wider and soft ones thinner.
  const feel = vel => Math.max(0, Math.min(1.3, 0.7 + (vel - 0.7) * 2 * S.vsens));

  const modeFor = mic => mic ? S.mmode : S.nmode;
  const modeOf = bar => modeFor(bar.mic);
  const keyMic = new Uint8Array(128); // which source last played each key
  const modeAt = n => modeFor(keyMic[n]);
  const downBar = []; // per note: a bar holding it down this frame, if any

  function noteOn(n, vel = 0.8, mic = false) {

    held.set(n + mic * 128, bar); bars.push(bar);

    const mode = modeOf(bar);

      wires.push({ bar, p: 0, q: 0, grown: 0 });
      if (wires.length > MAX_WIRES) wires.shift();

  }
  function noteOff(n, mic = false) {
    mic = !!mic;

    if (bar) { bar.end = performance.now(); held.delete(n + mic * 128); notesChanged(n, false); }

  }

  function spawn(x, y, vx, vy, life, size, hue) {
    if (particles.length < MAX_PARTICLES) {

      particles.push({ x, y, vx, vy, life, max: life, size: size * S.psize, col: spriteCol(hue) });

  }

        cx + (Math.random() - 0.5) * g.w * ww * S.width,
        y,
        (Math.random() - 0.5) * 140 * S.pspread * S.pspeed,
        -(40 + Math.random() * 260 * (0.4 + vel)) * S.pspeed,
        0.5 + Math.random() * 1.1,
        0.8 + Math.random() * 2,
        hueOf(n) + (Math.random() - 0.5) * 24,

    }
  }

  // ---------- Microphone ----------
  // Pitches heard by the microphone play the visualizer like keys, in the Microphone mode.
  //   One note  the time-domain signal is matched against itself shifted (YIN), which finds
  //             the period of a single voice or instrument
  //   Chords    every key is scored by the energy at its harmonics in the spectrum. The best is
  //             taken, its harmonics are removed, and the next best is scored, up to six notes.
  // A pitch heard steadily for a moment (a little longer for chords, whose attack smears
  // across the spectrum) presses its key, and a gap releases it. A key whose
  // pitch jumps louder while held is struck again, so a repeated note plays twice.
  const MIC_ON = 45, MIC_OFF = 140, MIC_POLY = 6, MIC_HARM = 6;
  const mic = { ac: null, stream: null, an: null, sr: 48000, time: null, half: null, yin: null,
    spec: null, mag: null, bins: null, notes: new Map(), shownAt: 0 };
  const NAMES = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];
  const noteName = n => NAMES[n % 12] + ((n / 12 | 0) - 1);
  const HW = Array.from({ length: MIC_HARM }, (_, h) => 0.8 ** h); // weight of each harmonic

  // For each key, the spectrum bins a quarter-semitone either side of each of its harmonics
  function binTable(sr, size) {
    const bw = sr / size, top = Math.min(sr / 2, 9000), tbl = [];
    tbl.lim = Math.min(size / 2, Math.ceil(top * 1.03 / bw) + 2);
    for (let n = LOW; n <= HIGH; n++) {

      if (best < 0 || bs < need || bs < top * (0.3 - 0.12 * S.msens)) break;

    if (best < 0) return;

  const found = new Map(); // note -> strength 0..1 relative to the loudest
  function listen(now) {
    const { an, time } = mic;
    an.getFloatTimeDomainData(time);

    for (let i = time.length - 2048; i < time.length; i++) sum += time[i] * time[i];
    const db = 10 * Math.log10(sum / 2048 + 1e-12), gate = -30 - 35 * S.msens;
    found.clear();
    if (db > gate) S.mdetect ? hearChords(found) : hearOne(found);
    const vel = Math.min(1, Math.max(0.15, 0.3 + (db - gate) / 35));
    for (const [n, k] of found) {
      let st = mic.notes.get(n);
      if (!st) mic.notes.set(n, st = { since: now, seen: now, on: false, floor: Infinity });
      // This note's own loudness, and a floor that drops with it at once but rises only slowly,
      // so a fresh strike stands well above it
      const v = vel * (0.6 + 0.4 * Math.sqrt(k)), level = db + 20 * Math.log10(Math.max(k, 0.01));
      st.floor = Math.min(level, st.floor + 20 * (now - st.seen) / 1000);

      if (!st.on && now - st.since >= (S.mdetect ? MIC_ON * 1.6 : MIC_ON)) { st.on = true; st.at = now; noteOn(n, v, true); }
      else if (st.on && level - st.floor > 8 && now - st.at > 150) { st.at = now; st.floor = level; noteOn(n, v, true); }
    }

      if (now - st.seen < (st.on ? MIC_OFF : 1)) continue;
      if (st.on) noteOff(n, true);
      mic.notes.delete(n);
    }
    if (now - mic.shownAt > 120) {
      mic.shownAt = now;
      const on = [...mic.notes].filter(([, st]) => st.on).map(([n]) => n).sort((a, b) => a - b);
      hear.textContent = on.length ? 'Hearing ' + on.map(noteName).join(' ') : 'Listening…';
    }
  }

  async function startMic() {

        bins: binTable(sr, an.fftSize) });

    }
  }

    mic.notes.clear();

  // ---------- Pointer play (for testing without a device) ----------
  const pointerNotes = new Map();
  function noteAt(px, py) {

    if (py < top) return null;

    if (py < top + kh * 0.63) {
      for (let n = LOW; n <= HIGH; n++) {
        const g = keyGeo[n];
        if (g.black && u >= g.x && u < g.x + g.w) return n;
      }
    }
    for (let n = LOW; n <= HIGH; n++) {
      const g = keyGeo[n];
      if (!g.black && u >= g.x && u < g.x + 1) return n;

    const n = noteAt(e.clientX, e.clientY);
    if (n != null) { pointerNotes.set(e.pointerId, n); noteOn(n, 0.8); canvas.setPointerCapture(e.pointerId); }
  });
  const pointerUp = e => {
    const n = pointerNotes.get(e.pointerId);
    if (n != null) { noteOff(n); pointerNotes.delete(e.pointerId); }
  };
  canvas.addEventListener('pointerup', pointerUp);
  canvas.addEventListener('pointercancel', pointerUp);

  // ---------- Sacred geometry backdrop ----------
  const TAU = Math.PI * 2, GOLDEN = Math.PI * (3 - Math.sqrt(5));
  const ring = (n, r, off = 0) =>
    Array.from({ length: n }, (_, i) => [Math.cos(off + TAU * i / n) * r, Math.sin(off + TAU * i / n) * r]);
  const allPairs = pts => pts.flatMap((a, i) => pts.slice(i + 1).map(b => [...a, ...b]));

  // String-art star: spokes with shorter branch generations between them, and
  // straight threads stitched from each spoke across to a neighbour.
  function weave(axes, depth, bscale, skip, d) {
    let spokes = Array.from({ length: axes }, (_, i) => ({ a: -Math.PI / 2 + TAU * i / axes, len: 1 }));
    for (let g = 1; g <= depth; g++) {
      const half = Math.PI / spokes.length;
      spokes = spokes.flatMap(s => [s, { a: s.a + half, len: bscale ** g }]);
    }
    const tips = spokes.map(s => [Math.cos(s.a) * s.len, Math.sin(s.a) * s.len]);
    const lines = [];
    tips.forEach((A, i) => {
      const B = tips[(i + skip) % tips.length];
      lines.push([0, 0, ...A]);
      for (let j = 0; j < d; j++) {
        const fa = (d - j) / d, fb = (j + 1) / d;
        lines.push([A[0] * fa, A[1] * fa, B[0] * fb, B[1] * fb]);
      }
    });

  function fifths(stage) {

  // Platonic solids: wireframes turning in space, nested one inside the next. Being solid, they

  const SOLIDS = (() => {
    const spins = v => [v, [v[1], v[2], v[0]], [v[2], v[0], v[1]]];

      const seen = new Map();

      all([[1, 0, 0]]),                                     // octahedron

  const NESTS = [[0], [1], [2], [3], [4], [1, 2], [3, 4], [4, 3, 1], [3, 4, 1, 2], [1, 0, 3, 4, 2]];
  function solids(nest) {
    const parts = nest.map(k => ({ ...SOLIDS[k], items: SOLIDS[k].edges.map(() => ({})), nodes: [] }));
    return {
      // One wire graph per solid; its corners move, so update refills nodes every frame
      graphs: parts.map(sd => {
        const adj = sd.verts.map(() => []);
        for (const [a, b] of sd.edges) { adj[a].push(b); adj[b].push(a); }
        return { nodes: sd.nodes, adj, rim: sd.verts.map((_, k) => k) };

      layers: nest.length, scale: 0.6, sym: 6, paths: [],

  // Penrose tiling: thick and thin rhombs that fill the plane with fivefold symmetry and never

  const PENROSE = [[2, 1], [3, 1.3], [3, 1], [4, 1.4], [4, 1.15], [4, 1], [5, 1.4], [5, 1.15], [5, 1], [6, 1.3]];

      const Q = mix(B, A), R = mix(B, C);

      if (Math.hypot(B[0] + C[0], B[1] + C[1]) / 2 * zoom > 0.94) continue;

  // Girih star: an Islamic star pattern made the way Hankin described. Tile the plane with

  // angle until they meet their neighbours. The tiles are never drawn, only the stars they leave.
  const GIRIH = [[1, 60], [1, 72], [2, 50], [2, 60], [2, 72], [3, 50], [3, 67.5], [3, 76], [4, 60], [4, 72]];
  function girih(n, degrees) {

  const SHAPES = [

    t => ({ layers: lerp(2, 5, t), scale: 0.7,  ...weave(lerp(5, 12, t), 1, 0.78, 1, lerp(5, 20, t)) }),
    t => ({ layers: lerp(2, 5, t), scale: 0.74, ...weave(lerp(5, 13, t), 0, 1, 2, lerp(8, 24, t)) }),
    t => ({ layers: lerp(1, 3, t), scale: 0.5,  circles: [[0, 0, 1], ...hexPts(lerp(1, 4, t))] }),

  function orbitsOf(shape) {

      if (!map.has(key)) map.set(key, { r, items: [] });

    while (orbits.length < 12) {

      shape.dim = Math.min(1, Math.sqrt(900 / strokes));

  //   energy   overall loudness; the whole figure breathes and turns a little faster

  const BANDS = 8, MAX_THREADS = 90;

  let lastNote = null, lastAt = 0;
  const pitchPos = n => (n - LOW) / (HIGH - LOW);

    arr[i] += v * (1 - (f - i)); arr[i + 1] += v * (f - i);

  // A note's place in the figure: pitch class sets the angle inside a mirrored wedge,

    const L = shape.layers, lw = S.gline;

              ctx.moveTo(it.x + Math.cos(a2) * it.r, it.y + Math.sin(a2) * it.r);

  function drawThreads(now, cx, cy, R, sym) {
    const react = S.greact, base = -Math.PI / 2 + geoT * 0.12;
    const Rf = R * (1 + 0.06 * react * live.energy);
    const polar = n => notePolar(n, sym, Rf);
    ctx.lineCap = 'round';
    for (let i = threads.length - 1; i >= 0; i--) {
      const t = threads[i];
      const a = linger(t.bar, now);
      if (a <= 0) { threads.splice(i, 1); continue; }
      if (modeOf(t.bar) === 2) continue;
      const [pa, ra] = polar(t.a), [pb, rb] = polar(t.b);
      ctx.beginPath();
      for (let k = 0; k < sym; k++) for (const m of [1, -1]) {
        const o = base + k * TAU / sym;
        if (t.a === t.b) {
          const x = cx + Math.cos(o + m * pa) * ra, y = cy + Math.sin(o + m * pa) * ra, r = 2 + 4 * t.vel;
          ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU);
        } else {
          ctx.moveTo(cx + Math.cos(o + m * pa) * ra, cy + Math.sin(o + m * pa) * ra);
          ctx.lineTo(cx + Math.cos(o + m * pb) * rb, cy + Math.sin(o + m * pb) * rb);

      const hue = (hueOf(t.a) + hueOf(t.b)) / 2 + react * live.hue;
      const alpha = S.gopacity * (0.25 + 0.75 * react) * a * Math.min(1, (now - t.born) / 150);
      ctx.strokeStyle = `hsla(${hue}, ${S.gsat * 100}%, 62%, ${alpha * 0.15})`;
      ctx.lineWidth = (4 + 3 * t.vel) * S.gline; ctx.stroke();
      ctx.strokeStyle = `hsla(${hue}, ${S.gsat * 100}%, 72%, ${alpha})`;
      ctx.lineWidth = (0.8 + t.vel) * S.gline; ctx.stroke();
    }
  }

  // Circle of fifths only: the notes sounding light their places on the ring, and lines join
  // them into the shape of the chord. A fifth is a short side, a tritone a diameter.
  function drawChord(now, cx, cy, rot, s) {
    const on = []; // per place on the ring: the strongest note sounding there
    for (const b of lights) {
      if (modeOf(b) === 2) continue;
      const a = linger(b, now) * (0.4 + 0.6 * b.vel), j = b.note * 7 % 12;
      if (a > 0 && !(on[j]?.a >= a)) on[j] = { a, hue: hueOf(b.note, b.vel), x: cx + Math.cos(rot + (j - 3) * TAU / 12) * s, y: cy + Math.sin(rot + (j - 3) * TAU / 12) * s };
    }
    const pts = on.filter(Boolean), strength = Math.min(1, S.gopacity * 2.5), sat = S.gsat * 100;
    ctx.lineCap = 'round';
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i], q = pts[(i + 1) % pts.length];
      ctx.fillStyle = `hsla(${p.hue}, ${sat}%, 72%, ${strength * p.a})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, (3 + 5 * p.a) * Math.sqrt(S.gline), 0, TAU); ctx.fill();
      if (pts.length < 2 || (pts.length === 2 && i)) continue; // two notes share one line
      const alpha = strength * Math.min(p.a, q.a);
      // Hues are averaged the short way round the wheel
      const hue = p.hue + (((q.hue - p.hue) % 360 + 540) % 360 - 180) / 2;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y);

      ctx.lineWidth = 9 * S.gline; ctx.stroke();
      ctx.strokeStyle = `hsla(${hue}, ${sat}%, 78%, ${alpha})`;
      ctx.lineWidth = 2 * S.gline; ctx.stroke();
    }
  }

  // ---------- Wireframe ----------
  // A note fires a wire from its key to a point on the rim of the backdrop, which is drawn in
  // grey. Where the wire lands, the note's colour runs into the figure as threads that follow
  // the figure's own lines, for as long as the key feeds it.
  const wires = [], MAX_WIRES = 80; // { bar, p, q, grown, shape, layer, graph, node, segs }

  // The figure as a graph: a node wherever strokes meet or cross, an edge for each piece of
  // stroke between two nodes. Circles are cut into short chords.
  function buildGraph(shape) {
    const segs = [...(shape.lines || [])];
    for (const [x, y, r] of shape.circles || []) {
      const n = Math.max(8, Math.min(64, Math.ceil(r * 64)));
      for (let k = 0; k < n; k++) {
        const a = TAU * k / n, b = TAU * (k + 1) / n;
        segs.push([x + Math.cos(a) * r, y + Math.sin(a) * r, x + Math.cos(b) * r, y + Math.sin(b) * r]);
      }
    }
    // Where two strokes cross, or one ends on another, both are cut. The densest figures are
    // made of short pieces that already meet end to end, so they skip this.
    const cuts = segs.map(() => [0, 1]), E = 1e-7;
    if (segs.length <= 2500) for (let i = 0; i < segs.length; i++) {
      const a = segs[i], ax = a[0], ay = a[1], rx = a[2] - ax, ry = a[3] - ay;
      const lox = Math.min(ax, a[2]) - E, hix = Math.max(ax, a[2]) + E, loy = Math.min(ay, a[3]) - E, hiy = Math.max(ay, a[3]) + E;
      for (let j = i + 1; j < segs.length; j++) {
        const c = segs[j], cx = c[0], cy = c[1], dx = c[2], dy = c[3];
        if ((cx < lox && dx < lox) || (cx > hix && dx > hix) || (cy < loy && dy < loy) || (cy > hiy && dy > hiy)) continue;
        const sx = dx - cx, sy = dy - cy, den = rx * sy - ry * sx;
        if (Math.abs(den) < 1e-12) continue;
        const t = ((cx - ax) * sy - (cy - ay) * sx) / den, u = ((cx - ax) * ry - (cy - ay) * rx) / den;
        if (t < -E || t > 1 + E || u < -E || u > 1 + E) continue;
        if (t > E && t < 1 - E) cuts[i].push(t);
        if (u > E && u < 1 - E) cuts[j].push(u);
      }
    }
    const nodes = [], adj = [], ids = new Map();
    const id = (x, y) => {
      const key = Math.round(x * 1e4) + ',' + Math.round(y * 1e4);
      let k = ids.get(key);
      if (k == null) { ids.set(key, k = nodes.length); nodes.push([x, y]); adj.push([]); }
      return k;
    };
    segs.forEach(([ax, ay, bx, by], i) => {
      const ts = cuts[i].sort((p, q) => p - q);
      let a = id(ax, ay);
      for (let k = 1; k < ts.length; k++) {
        const b = id(ax + (bx - ax) * ts[k], ay + (by - ay) * ts[k]);
        if (b !== a && !adj[a].includes(b)) { adj[a].push(b); adj[b].push(a); }
        a = b;
      }
    });
    // The rim: nodes in the outer fifth of the figure
    const rad = nodes.map(p => Math.hypot(p[0], p[1])), far = rad.reduce((m, r) => Math.max(m, r), 0);
    const rim = [];
    rad.forEach((r, k) => { if (r >= far * 0.8) rim.push(k); });
    return { nodes, adj, rim };
  }
  // One graph per layer. Layers of a flat figure are copies of each other and share one.
  const graphsOf = shape => shape.graphs ??= Array(shape.layers).fill(buildGraph(shape));

  // Picks where a wire lands: a random rim node, on a layer chosen in proportion to its size
  function aim(w, shape) {
    const graphs = graphsOf(shape);
    let li = 0, pick = Math.random() * graphs.reduce((sum, g, i) => sum + shape.scale ** i, 0);
    while (li < graphs.length - 1 && (pick -= shape.scale ** li) > 0) li++;
    w.shape = shape; w.layer = li; w.graph = graphs[li]; w.segs = null;
    w.node = w.graph.rim[Math.random() * w.graph.rim.length | 0] || 0;
  }

  // The threads a hit sends through the figure, as edges [from, to, distance run before it, length]
  // in the order the colour reaches them. A few walkers leave the node. Each prefers to carry
  // straight on, takes no edge twice, and now and then splits in two at a junction.
  function spread(g, start) {
    const { nodes, adj } = g, N = nodes.length, used = new Set(), segs = [], opts = [];
    const walkers = [];
    for (let k = Math.min(3, adj[start].length); k > 0; k--) walkers.push({ at: start, from: -1, d: 0 });
    while (walkers.length && segs.length < 2500) {
      let wi = 0; // the walker that has run the least goes next, so the threads grow evenly
      for (let k = 1; k < walkers.length; k++) if (walkers[k].d < walkers[wi].d) wi = k;
      const w = walkers[wi], [x, y] = nodes[w.at];
      let total = 0;
      opts.length = 0;
      for (const nb of adj[w.at]) {
        if (used.has(w.at < nb ? w.at * N + nb : nb * N + w.at)) continue;
        const dx = nodes[nb][0] - x, dy = nodes[nb][1] - y, len = Math.hypot(dx, dy) || 1e-6;
        let wt = 1;
        if (w.from >= 0) {
          const px = x - nodes[w.from][0], py = y - nodes[w.from][1];
          wt = 0.03 + ((1 + (px * dx + py * dy) / (len * (Math.hypot(px, py) || 1e-6))) / 2) ** 3;
        }
        opts.push(nb, wt, len); total += wt;
      }
      if (!opts.length || w.d > 6) { walkers.splice(wi, 1); continue; }
      let k = 0;
      for (let r = Math.random() * total; k < opts.length - 3 && (r -= opts[k + 1]) > 0;) k += 3;
      const nb = opts[k], len = opts[k + 2];
      used.add(w.at < nb ? w.at * N + nb : nb * N + w.at);
      segs.push([w.at, nb, w.d, len]);
      if (opts.length > 3 && walkers.length < 14 && Math.random() < Math.min(0.5, len * 3))
        walkers.push({ at: w.at, from: w.from, d: w.d });
      w.from = w.at; w.at = nb; w.d += len;
    }
    return segs;
  }

  // A repeatable random number from 0 to 1 for a pair of numbers
  const noise = (a, b) => { const v = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return v - Math.floor(v); };

  function drawWires(dt, now, shape, cx, cy, tf, keyTop) {
    const ww = W / WHITES, rate = 4 * S.speed * H; // the wire's head, in pixels per second
    ctx.lineCap = ctx.lineJoin = 'round';
    for (let i = wires.length - 1; i >= 0; i--) {
      const w = wires[i], b = w.bar;
      if (modeOf(b) !== 2) { wires.splice(i, 1); continue; } // its source left Wireframe
      if (w.shape !== shape) aim(w, shape); // new wire, or the figure changed under it
      const nodes = w.graph.nodes, P = nodes[w.node], [rot, s] = tf[w.layer];
      const cos = Math.cos(rot) * s, sin = Math.sin(rot) * s;
      const tx = cx + P[0] * cos - P[1] * sin, ty = cy + P[0] * sin + P[1] * cos; // where it lands, turning with the figure
      const g = keyGeo[b.note], kx = (g.x + g.w / 2) * ww;
      // p is how far the head has got, q the tail, which leaves the key when the note is released
      const step = dt * rate / Math.max(60, Math.hypot(tx - kx, ty - keyTop));
      w.p = Math.min(1, w.p + step);
      if (b.end != null) w.q = Math.min(w.p, w.q + step);
      if (w.p >= 1 && !w.segs) { w.segs = spread(w.graph, w.node); w.hitAt ??= now; w.grown ||= 0.08; }
      let fade = 1;
      // Once landed, the colour runs for the Spread time whether or not the key is still down.
      // With Held notes set to Keep spreading it also runs for as long as the wire feeds it.
      // It fades after that, and after the whole wire has gone in.
      const growing = w.p >= 1 && (now - w.hitAt < S.gspread * 1000 || (S.ghold && w.q < 1));
      if (growing) w.grown += dt * 0.9 * S.gdraw * (0.5 + b.vel);
      else if (w.q >= 1) {
        w.doneAt ??= now;
        fade = 1 - (now - w.doneAt) / ((1500 + Math.min(4500, (b.end - b.start) * 2)) * S.gfade);
        if (fade <= 0) { wires.splice(i, 1); continue; }
      }

      const hue = hueOf(b.note, b.vel), ve = feel(b.vel), glow = 0.4 + S.glow;
      const light = 56 + 14 * ve, alpha = fade * Math.min(1, 0.45 + 0.55 * ve);
      if (w.segs) {
        ctx.save();
        ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(s, s);
        ctx.beginPath();
        // Effects are at full strength while the threads grow, and linger faintly once they stop.
        //   Shimmer   bright pulses that travel along the threads
        //   Electric  jagged arcs that jump along pieces of thread, redrawn many times a second
        //   Sparks    particles thrown off the growing tips, and a few shed along the threads
        const fx = fade * (growing ? 1 : 0.35), tick = now / 55 | 0;
        const hi = S.gshimmer > 0 ? new Path2D() : null, zap = S.gelectric > 0 ? new Path2D() : null;
        const tips = growing && S.gsparks > 0, shed = S.gsparks > 0 ? Math.floor(S.gsparks * 60 * fx * dt + Math.random()) : 0;
        const at = (x, y) => [cx + x * cos - y * sin, cy + x * sin + y * cos]; // figure to screen
        let k = 0;
        for (const sg of w.segs) {
          if (sg[2] >= w.grown) break;
          const A = nodes[sg[0]], B = nodes[sg[1]], t = Math.min(1, (w.grown - sg[2]) / sg[3]);
          const ex = A[0] + (B[0] - A[0]) * t, ey = A[1] + (B[1] - A[1]) * t;
          ctx.moveTo(A[0], A[1]); ctx.lineTo(ex, ey);
          k++;
          const pulse = hi && Math.sin(sg[2] * 14 - now * 0.006 + b.note) > 0.6;
          const arc = zap && noise(k, tick) < 0.04 + 0.2 * S.gelectric;
          if (!pulse && !arc && !(tips && t < 1)) continue;
          const [x0, y0] = at(A[0], A[1]), [x1, y1] = at(ex, ey);
          if (pulse) { hi.moveTo(x0, y0); hi.lineTo(x1, y1); }
          if (arc) {
            const len = Math.hypot(x1 - x0, y1 - y0) || 1;
            const kick = Math.min(len * 0.6, 2 + 7 * S.gelectric) * (noise(k + 0.5, tick) * 2 - 1) / len;
            zap.moveTo(x0, y0); zap.lineTo((x0 + x1) / 2 - (y1 - y0) * kick, (y0 + y1) / 2 + (x1 - x0) * kick); zap.lineTo(x1, y1);
          }
          if (tips && t < 1) for (let n = Math.floor(S.gsparks * 200 * dt + Math.random()); n > 0; n--)
            spawn(x1, y1, (Math.random() - 0.5) * 170, (Math.random() - 0.5) * 170, 0.3 + Math.random() * 0.7, 0.7 + Math.random() * 1.6, hue + (Math.random() - 0.5) * 30);
        }
        for (let n = shed; n > 0 && k; n--) {
          const sg = w.segs[Math.random() * k | 0], A = nodes[sg[0]], B = nodes[sg[1]], t = Math.random() * Math.min(1, (w.grown - sg[2]) / sg[3]);
          const [x, y] = at(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t);
          spawn(x, y, (Math.random() - 0.5) * 30, (Math.random() - 0.5) * 30, 0.4 + Math.random() * 0.7, 0.5 + Math.random() * 0.9, hue + (Math.random() - 0.5) * 30);
        }
        ctx.restore(); // the path keeps its transform; stroke width stays in screen pixels
        const hit = Math.exp(-(now - w.hitAt) / 250);
        ctx.strokeStyle = `hsla(${hue}, 95%, 60%, ${alpha * 0.16})`;
        ctx.lineWidth = (5 + 4 * b.vel) * S.gline * glow; ctx.stroke();
        ctx.strokeStyle = `hsla(${hue}, 95%, ${light + 8}%, ${alpha})`;
        ctx.lineWidth = (0.9 + b.vel) * S.gline; ctx.stroke();
        if (hi) {
          ctx.strokeStyle = `hsla(${hue}, 100%, 90%, ${fx * S.gshimmer * 0.8})`;
          ctx.lineWidth = (1.3 + b.vel) * S.gline * 1.5; ctx.stroke(hi);
        }
        if (zap) {
          ctx.strokeStyle = `hsla(${hue}, 70%, 92%, ${fx * (0.4 + 0.4 * S.gelectric)})`;
          ctx.lineWidth = Math.max(1, 0.8 * S.gline); ctx.stroke(zap);
        }
        if (hit > 0.02) {
          ctx.fillStyle = `hsla(${hue}, 100%, 80%, ${hit * 0.8})`;
          ctx.beginPath(); ctx.arc(tx, ty, (3 + 10 * b.vel) * hit * glow + 1, 0, TAU); ctx.fill();
        }
      }
      if (w.q < 1) {
        // The wire leaves the key straight up, then bends over to its point on the rim
        const my = keyTop - (keyTop - ty) * 0.6, n = 24;
        ctx.beginPath();
        for (let k = 0; k <= n; k++) {
          const t = w.q + (w.p - w.q) * k / n, u = 1 - t;
          ctx.lineTo(u * u * kx + 2 * u * t * kx + t * t * tx, u * u * keyTop + 2 * u * t * my + t * t * ty);

        const core = (0.6 + 2.6 * S.width) * girth(b.vel);
        const shimmer = w.p >= 1 && b.end == null ? 0.85 + 0.15 * Math.sin(now * 0.006 + b.note * 2.1) : 1;
        ctx.strokeStyle = `hsla(${hue}, 95%, 60%, ${0.07 * shimmer})`;
        ctx.lineWidth = core + 30 * S.glow; ctx.stroke();
        ctx.strokeStyle = `hsla(${hue}, 95%, 60%, ${0.2 * shimmer})`;
        ctx.lineWidth = core + 9 * S.glow; ctx.stroke();
        ctx.strokeStyle = `hsla(${hue}, 95%, ${light + 12}%, ${Math.min(1, 0.5 + 0.5 * ve) * shimmer})`;
        ctx.lineWidth = core; ctx.stroke();
      }
    }
  }

  // ---------- Thunder ----------
  // A note sends nothing up from its key. A cloud of its colour lights up at a random place
  // behind everything, as if by lightning inside it: it flashes and flickers, glows on while
  // the key is down, then fades. The harder the strike, the bigger the cloud. A cloud is a few
  // soft puffs that light a moment apart. They hold no detail, so they are painted small and
  // scaled up, and they add to each other where they overlap.
  const clouds = [], MAX_CLOUDS = 60, CLOUD_K = 4; // { bar, x, y, r, puffs }
  const cloudCanvas = document.createElement('canvas');
  const cctx = cloudCanvas.getContext('2d');
  function strike(bar) {
    const hue = hueOf(bar.note, bar.vel), v = Math.min(1, feel(bar.vel));
    clouds.push({ bar, x: rnd(0.04, 0.96), y: rnd(0.08, 0.88), r: 0.1 + 0.45 * v * v,
      puffs: Array.from({ length: 6 }, (_, i) => ({
        dx: i ? rnd(-0.75, 0.75) : 0, dy: i ? rnd(-0.4, 0.4) : 0, r: i ? rnd(0.45, 0.85) : 1,
        hue: Math.round((hue + rnd(-14, 14)) / 4) * 4, wait: i ? rnd(0, 160) : 0, seed: rnd(0, 100),
      })) });
    if (clouds.length > MAX_CLOUDS) clouds.shift();
  }
  function drawClouds(now, keyTop) {
    if (!uses(3)) { clouds.length = 0; return; }
    if (!clouds.length || keyTop < 1) return;
    const cw = Math.ceil(W / CLOUD_K), ch = Math.ceil(keyTop / CLOUD_K);
    if (cloudCanvas.width !== cw || cloudCanvas.height !== ch) { cloudCanvas.width = cw; cloudCanvas.height = ch; }
    else { cctx.setTransform(1, 0, 0, 1, 0, 0); cctx.clearRect(0, 0, cw, ch); }
    cctx.globalCompositeOperation = 'lighter';
    const unit = Math.min(W, keyTop) * S.tsize / CLOUD_K, tick = now / 50 | 0, bright = S.tbright;
    for (let i = clouds.length - 1; i >= 0; i--) {
      const c = clouds[i], b = c.bar;
      const fade = b.end == null ? 1 : 1 - (now - b.end) / (S.tfade * 1000);
      if (fade <= 0 || modeOf(b) !== 3) { clouds.splice(i, 1); continue; }
      const R = c.r * unit;
      for (const p of c.puffs) {
        const t = now - b.start - p.wait;
        if (t < 0) continue;
        // The flash dies away in a fraction of a second, flickering at first
        const flash = Math.exp(-t / 260) * (1 - 0.5 * noise(tick, p.seed) * Math.exp(-t / 150));
        const r = R * p.r * (1 + 0.12 * flash);
        cctx.globalAlpha = fade * fade * (0.35 * Math.min(1, t / 150) + 0.65 * flash);
        // One gradient per hue and brightness, one unit across; the transform places and sizes it
        cctx.fillStyle = gradient(`cloud:${p.hue}:${bright}`, () => {
          const g = cctx.createRadialGradient(0, 0, 0, 0, 0, 1);
          g.addColorStop(0, `hsla(${p.hue}, 100%, ${30 + 60 * bright}%, 1)`);
          g.addColorStop(0.35, `hsla(${p.hue}, 95%, ${25 + 35 * bright}%, 0.45)`);
          g.addColorStop(1, `hsla(${p.hue}, 95%, ${25 + 35 * bright}%, 0)`);

        });
        cctx.setTransform(r, 0, 0, r, c.x * cw + p.dx * R, c.y * ch + p.dy * R);
        cctx.fillRect(-1, -1, 2, 2);
      }
    }
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = S.topacity;
    ctx.drawImage(cloudCanvas, 0, 0, cw * CLOUD_K, ch * CLOUD_K);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  let geoT = 0;
  function drawGeometry(dt, now, keyTop) {
    updateLive(dt);
    const react = S.greact;
    geoT += dt * S.gspin * (1 + react * live.energy);
    const wire = uses(2); // the figure goes grey when either source is in Wireframe
    if (!wire) wires.length = 0;
    if ((S.gopacity <= 0 && !wire) || keyTop < 40) return;
    const shape = currentShape();
    const R = Math.min(W * 0.48, keyTop * 0.54) * S.gsize, cx = W / 2, cy = keyTop / 2;
    const sym = shape.sym || 6, reveal = S.greveal === 1, lw = S.gline;
    shape.update?.(geoT);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, keyTop); ctx.clip();
    ctx.globalCompositeOperation = 'lighter';
    const tf = []; // per layer: [rotation, scale]
    for (let i = 0; i < shape.layers; i++) {
      const rot = i * GOLDEN + geoT * 0.25 * (1 + 0.23 * i) * (i % 2 ? -1 : 1);
      const pos = shape.layers > 1 ? i / (shape.layers - 1) : 0.5; // layer's register, bass outside
      const lv = react * bandAt(pos * (BANDS - 1));

        * (1 + 0.1 * lv + 0.04 * react * live.energy);

      const hue = S.hue + S.spread * pos + react * live.hue, sat = wire ? 0 : S.gsat * 100;
      const alpha = S.gopacity * shape.dim * (1 + 1.2 * lv);
