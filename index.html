<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rachmaninoff Visualizer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
  body { font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: #dfe3ee; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  body.idle { cursor: none; }

  .ui { transition: opacity .4s; }
  body.idle .ui { opacity: 0; pointer-events: none; }

  #bar {
    position: fixed; top: 14px; right: 14px; display: flex; gap: 8px; align-items: center;
  }
  #status {
    display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px;
    background: rgba(18, 20, 30, .85); border: 1px solid rgba(255, 255, 255, .08);
    max-width: 46vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #666; }
  #dot.on { background: #4ade80; box-shadow: 0 0 10px #4ade80; }
  #dot.err { background: #f87171; }

  button {
    font: inherit; color: inherit; cursor: pointer; padding: 7px 12px; border-radius: 999px;
    background: rgba(18, 20, 30, .85); border: 1px solid rgba(255, 255, 255, .08);
  }
  button:hover { background: rgba(40, 44, 62, .92); }

  #panel {
    position: fixed; top: 60px; right: 14px; width: 250px; padding: 14px 16px 12px;
    border-radius: 16px; background: rgba(18, 20, 30, .85); border: 1px solid rgba(255, 255, 255, .08);
    max-height: calc(100vh - 74px); overflow-y: auto;
  }
  #panel[hidden] { display: none; }
  details { margin-bottom: 10px; }
  summary {
    cursor: pointer; margin-bottom: 10px; color: #dfe3ee; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase; font-size: 11px;
  }
  .row { margin-bottom: 10px; }
  .row label { display: flex; justify-content: space-between; margin-bottom: 3px; color: #aab1c5; }
  .row output { color: #6f778d; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; margin: 0; accent-color: #8ea2ff; }
  .pair { display: flex; gap: 6px; margin-bottom: 6px; }
  .pair > * { flex: 1; min-width: 0; }
  .pair > #load { flex: none; }
  input[type=text] {
    font: inherit; color: inherit; padding: 7px 12px; border-radius: 999px;
    background: rgba(0, 0, 0, .3); border: 1px solid rgba(255, 255, 255, .08); outline: none;
  }
  input[type=text]:focus { border-color: #8ea2ff; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="bar" class="ui">
  <div id="status"><span id="dot"></span><span id="statusText">Looking for MIDI…</span></div>
  <button id="toggle" title="Controls (H)">Controls</button>
  <button id="fs" title="Fullscreen (F)">Fullscreen</button>
</div>

<div id="panel" class="ui">
  <div id="rows"></div>
  <details open>
    <summary>Preset</summary>
    <div class="pair">
      <button id="copyLink">Copy link</button>
      <button id="copyCode">Copy code</button>
    </div>
    <div class="pair">
      <input id="code" type="text" placeholder="Paste code or link" spellcheck="false" autocomplete="off">
      <button id="load">Load</button>
    </div>
  </details>
  <div class="pair">
    <button id="random" title="Randomize (R)">Randomize</button>
    <button id="reset">Reset</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ---------- Settings ----------
  const GROUPS = [
    { title: 'Keyboard', controls: [
      { key: 'speed',     label: 'Speed',           min: 0.05, max: 1.5, step: 0.01, def: 0.35 },
      { key: 'width',     label: 'Note width',      min: 0.2,  max: 1,   step: 0.01, def: 0.8 },
      { key: 'round',     label: 'Roundness',       min: 0,    max: 1,   step: 0.01, def: 0.5 },
      { key: 'wiggle',    label: 'Wiggle',          min: 0,    max: 1,   step: 0.01, def: 0 },
      { key: 'glow',      label: 'Glow',            min: 0,    max: 1,   step: 0.01, def: 0.6 },
      { key: 'particles', label: 'Particles',       min: 0,    max: 1,   step: 0.01, def: 0.4 },
      { key: 'pspeed',    label: 'Particle speed',  min: 0.2,  max: 3,   step: 0.01, def: 1 },
      { key: 'pspread',   label: 'Particle spread', min: 0,    max: 3,   step: 0.01, def: 1 },
      { key: 'shed',      label: 'Note shedding',   min: 0,    max: 1,   step: 0.01, def: 0.4 },
      { key: 'hue',       label: 'Hue',             min: 0,    max: 360, step: 1,    def: 215 },
      { key: 'spread',    label: 'Color spread',    min: 0,    max: 360, step: 1,    def: 110 },
      { key: 'keys',      label: 'Keyboard height', min: 0,    max: 0.3, step: 0.005, def: 0.16 },
    ] },
    { title: 'Background', controls: [
      { key: 'gshape',    label: 'Shape',           min: 0,    max: 6,   step: 1,    def: 0,
        names: ['Star weave', 'Lotus', 'Lattice', 'Flower of Life', "Metatron's Cube", 'Mystic Rose', 'Torus'] },
      { key: 'gcomplex',  label: 'Complexity',      min: 1,    max: 10,  step: 1,    def: 5 },
      { key: 'gspin',     label: 'Spin',            min: 0,    max: 3,   step: 0.01, def: 0.4 },
      { key: 'gopacity',  label: 'Opacity',         min: 0,    max: 1,   step: 0.01, def: 0.35 },
      { key: 'gsat',      label: 'Saturation',      min: 0,    max: 1,   step: 0.01, def: 0.8 },
      { key: 'greveal',   label: 'Appears',         min: 0,    max: 1,   step: 1,    def: 0, names: ['Always', 'When played'] },
      { key: 'gdraw',     label: 'Draw speed',      min: 0.2,  max: 4,   step: 0.05, def: 1, when: () => S.greveal === 1 },
      { key: 'gfade',     label: 'Fade time',       min: 0.2,  max: 4,   step: 0.05, def: 1, when: () => S.greveal === 1 },
      { key: 'greact',    label: 'Play response',   min: 0,    max: 1,   step: 0.01, def: 0.4 },
      { key: 'weather',   label: 'Weather',         min: 0,    max: 2,   step: 1,    def: 0, names: ['Off', 'Rain', 'Snow'] },
      { key: 'wamount',   label: 'Weather amount',  min: 0.05, max: 1,   step: 0.01, def: 0.5 },
    ] },
  ];
  const CONTROLS = GROUPS.flatMap(g => g.controls);
  const STORE = 'rach-viz-settings';
  const S = {};
  CONTROLS.forEach(c => S[c.key] = c.def);
  try { Object.assign(S, JSON.parse(localStorage.getItem(STORE) || '{}')); } catch {}
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch {} };

  const rows = document.getElementById('rows');
  const inputs = {};
  for (const g of GROUPS) {
    const section = document.createElement('details');
    section.open = true;
    section.innerHTML = `<summary>${g.title}</summary>`;
    rows.appendChild(section);
    for (const c of g.controls) {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<label><span>${c.label}</span><output></output></label>
        <input type="range" min="${c.min}" max="${c.max}" step="${c.step}">`;
      const input = row.querySelector('input'), out = row.querySelector('output');
      const show = () => out.textContent = c.names ? c.names[+input.value] : (+input.value).toFixed(c.step < 1 ? 2 : 0);
      input.value = S[c.key]; show();
      input.addEventListener('input', () => { S[c.key] = +input.value; show(); save(); dropHash(); syncRows(); });
      inputs[c.key] = { input, show, row };
      section.appendChild(row);
    }
  }
  // Some sliders only apply in one mode; show them only then
  function syncRows() { for (const c of CONTROLS) if (c.when) inputs[c.key].row.hidden = !c.when(); }
  syncRows();
  document.getElementById('reset').onclick = () => {
    for (const c of CONTROLS) { S[c.key] = c.def; inputs[c.key].input.value = c.def; inputs[c.key].show(); }
    save(); dropHash(); syncRows();
  };
  // Every slider gets a uniform random value from its own range
  const randomize = () => {
    for (const c of CONTROLS) {
      const { input, show } = inputs[c.key];
      input.value = c.min + Math.random() * (c.max - c.min); // the range input snaps to its step
      S[c.key] = +input.value; show();
    }
    save(); dropHash(); syncRows();
  };
  document.getElementById('random').onclick = randomize;

  // ---------- Presets ----------
  // A preset code is every slider as key=value, e.g. "speed=0.35&width=0.8&...".
  // The same string after a # in the URL loads it on arrival.
  const presetCode = () => CONTROLS.map(c => `${c.key}=${S[c.key]}`).join('&');
  const presetLink = () => location.href.split('#')[0] + '#' + presetCode();
  // Accepts a code or a whole link. Sliders the code doesn't mention keep their value.
  function loadPreset(text) {
    const params = new URLSearchParams(text.trim().split('#').pop());
    let found = 0;
    for (const c of CONTROLS) {
      const raw = params.get(c.key), v = parseFloat(raw);
      if (raw == null || !Number.isFinite(v)) continue;
      const { input, show } = inputs[c.key];
      input.value = v; // the range input clamps and snaps to its step
      S[c.key] = +input.value; show(); found++;
    }
    if (found) { save(); syncRows(); }
    return found > 0;
  }
  // Once the sliders move, the preset in the address bar no longer describes them
  function dropHash() { if (location.hash) history.replaceState(null, '', location.pathname + location.search); }

  const flashLabel = (btn, text) => {
    const was = btn.dataset.label ??= btn.textContent;
    btn.textContent = text;
    clearTimeout(btn.timer);
    btn.timer = setTimeout(() => btn.textContent = was, 1200);
  };
  const codeBox = document.getElementById('code'), loadBtn = document.getElementById('load');
  const copy = (btn, text) => {
    const shown = () => { codeBox.value = text; codeBox.select(); flashLabel(btn, 'Copy from box'); };
    if (!navigator.clipboard) return shown();
    navigator.clipboard.writeText(text).then(() => flashLabel(btn, 'Copied'), shown);
  };
  document.getElementById('copyLink').onclick = e => copy(e.currentTarget, presetLink());
  document.getElementById('copyCode').onclick = e => copy(e.currentTarget, presetCode());
  loadBtn.onclick = () => {
    if (!codeBox.value.trim()) return;
    if (loadPreset(codeBox.value)) { codeBox.value = ''; dropHash(); flashLabel(loadBtn, 'Loaded'); }
    else flashLabel(loadBtn, 'Invalid');
  };
  codeBox.addEventListener('keydown', e => { if (e.key === 'Enter') loadBtn.click(); });
  if (location.hash.length > 1) loadPreset(location.hash);
  addEventListener('hashchange', () => { if (location.hash.length > 1) loadPreset(location.hash); });

  // ---------- Keyboard geometry ----------
  const LOW = 21, HIGH = 108, WHITES = 52;
  const isBlack = n => [1, 3, 6, 8, 10].includes(n % 12);
  const keyGeo = []; // per note: { x, w, black } in units of white-key widths
  {
    let wi = 0;
    for (let n = LOW; n <= HIGH; n++) {
      if (isBlack(n)) keyGeo[n] = { x: wi - 0.3, w: 0.6, black: true };
      else { keyGeo[n] = { x: wi, w: 1, black: false }; wi++; }
    }
  }

  // ---------- Canvas ----------
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  // Bars render to their own layer: they glow additively against each other, then cover the backdrop
  const barCanvas = document.createElement('canvas');
  const bctx = barCanvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    barCanvas.width = canvas.width = Math.round(W * DPR);
    barCanvas.height = canvas.height = Math.round(H * DPR);
  }
  addEventListener('resize', resize);
  resize();

  // Bar glow: the whole bar layer is blurred once at low resolution and added back onto itself.
  // Browsers without canvas filters fall back to a shadow per bar.
  const fastGlow = typeof bctx.filter === 'string';
  const glowCanvas = document.createElement('canvas');
  const gctx = glowCanvas.getContext('2d');
  function glowBars() {
    const sigma = S.glow * 17; // CSS pixels, the same spread as shadowBlur = glow * 34
    const k = sigma > 6 ? 4 : 2; // a wide blur hides a coarser copy
    const gw = Math.ceil(W / k), gh = Math.ceil(H / k);
    if (glowCanvas.width !== gw || glowCanvas.height !== gh) { glowCanvas.width = gw; glowCanvas.height = gh; }
    else gctx.clearRect(0, 0, gw, gh);
    gctx.filter = `blur(${sigma / k}px)`;
    gctx.drawImage(barCanvas, 0, 0, W / k, H / k);
    bctx.drawImage(glowCanvas, 0, 0, gw * k, gh * k);
  }

  // Gradients are built once and reused until the value they were built from changes
  const gradients = new Map();
  function gradient(key, make) {
    let g = gradients.get(key);
    if (!g) {
      if (gradients.size > 600) gradients.clear();
      gradients.set(key, g = make());
    }
    return g;
  }

  // Particles are stamped from a sheet of pre-drawn dots: a column per hue, a row per brightness
  const HUES = 72, TONES = 4, CELL = 16, DOT = 7;
  const sprites = document.createElement('canvas');
  {
    sprites.width = HUES * CELL; sprites.height = TONES * CELL;
    const sc = sprites.getContext('2d');
    for (let h = 0; h < HUES; h++) for (let t = 0; t < TONES; t++) {
      sc.fillStyle = `hsl(${h * 360 / HUES}, 100%, ${65 + 25 * (t + 0.5) / TONES}%)`;
      sc.beginPath(); sc.arc((h + 0.5) * CELL, (t + 0.5) * CELL, DOT, 0, Math.PI * 2); sc.fill();
    }
  }
  const spriteCol = hue => Math.round(((hue % 360) + 360) % 360 * HUES / 360) % HUES;

  // ---------- Note state ----------
  const held = new Map();   // note -> bar
  const bars = [];          // { note, vel, start, end|null }
  const particles = [];
  const flash = new Float32Array(128);
  const MAX_PARTICLES = 9000;

  const hueOf = n => (S.hue + S.spread * (n - LOW) / (HIGH - LOW)) % 360;
  const colorOf = (n, l = 62, a = 1) => `hsla(${hueOf(n)}, 95%, ${keyGeo[n].black ? l - 10 : l}%, ${a})`;

  function noteOn(n, vel = 0.8) {
    if (n < LOW || n > HIGH) return;
    if (held.has(n)) noteOff(n);
    const bar = { note: n, vel, start: performance.now(), end: null };
    held.set(n, bar); bars.push(bar);
    flash[n] = 1;
    feed(bar);
    burst(n, vel, Math.round(amount() * 0.5 * (0.4 + vel)));
  }
  function noteOff(n) {
    const bar = held.get(n);
    if (bar) { bar.end = performance.now(); held.delete(n); }
  }

  // Particle slider is curved so the top of its range gets wild
  const amount = () => 12 * S.particles + 260 * S.particles ** 3;

  function spawn(x, y, vx, vy, life, size, hue) {
    if (particles.length < MAX_PARTICLES) particles.push({ x, y, vx, vy, life, max: life, size, col: spriteCol(hue) });
  }

  function burst(n, vel, count) {
    const g = keyGeo[n], ww = W / WHITES;
    const cx = (g.x + g.w / 2) * ww, y = H * (1 - S.keys);
    for (let i = 0; i < count; i++) {
      spawn(
        cx + (Math.random() - 0.5) * g.w * ww * S.width,
        y,
        (Math.random() - 0.5) * 140 * S.pspread * S.pspeed,
        -(40 + Math.random() * 260 * (0.4 + vel)) * S.pspeed,
        0.5 + Math.random() * 1.1,
        0.8 + Math.random() * 2,
        hueOf(n) + (Math.random() - 0.5) * 24,
      );
    }
  }

  // ---------- MIDI ----------
  const dot = document.getElementById('dot'), statusText = document.getElementById('statusText');
  function setStatus(text, cls) { statusText.textContent = text; dot.className = cls || ''; }

  function onMidi(e) {
    const [st, d1, d2] = e.data;
    const cmd = st & 0xf0;
    if (cmd === 0x90 && d2 > 0) noteOn(d1, d2 / 127);
    else if (cmd === 0x80 || (cmd === 0x90 && d2 === 0)) noteOff(d1);
  }
  function hookInputs(access) {
    const names = [];
    for (const input of access.inputs.values()) {
      input.onmidimessage = onMidi;
      if (input.state === 'connected') names.push(input.name);
    }
    if (names.length) setStatus(names.join(', '), 'on');
    else setStatus('No MIDI device. Plug one in.', '');
  }
  let midiStarted = false;
  function startMidi() {
    if (midiStarted) return;
    if (!navigator.requestMIDIAccess) { setStatus('Web MIDI unsupported. Use Chrome or Edge.', 'err'); return; }
    midiStarted = true;
    navigator.requestMIDIAccess().then(access => {
      hookInputs(access);
      access.onstatechange = () => hookInputs(access);
    }).catch(() => {
      midiStarted = false;
      setStatus('MIDI blocked. Allow access, then click anywhere.', 'err');
    });
  }
  startMidi();
  addEventListener('pointerdown', startMidi);

  // ---------- Pointer play (for testing without a device) ----------
  const pointerNotes = new Map();
  function noteAt(px, py) {
    const kh = H * S.keys, top = H - kh;
    if (py < top) return null;
    const u = px / (W / WHITES);
    if (py < top + kh * 0.63) {
      for (let n = LOW; n <= HIGH; n++) {
        const g = keyGeo[n];
        if (g.black && u >= g.x && u < g.x + g.w) return n;
      }
    }
    for (let n = LOW; n <= HIGH; n++) {
      const g = keyGeo[n];
      if (!g.black && u >= g.x && u < g.x + 1) return n;
    }
    return null;
  }
  canvas.addEventListener('pointerdown', e => {
    const n = noteAt(e.clientX, e.clientY);
    if (n != null) { pointerNotes.set(e.pointerId, n); noteOn(n, 0.8); canvas.setPointerCapture(e.pointerId); }
  });
  const pointerUp = e => {
    const n = pointerNotes.get(e.pointerId);
    if (n != null) { noteOff(n); pointerNotes.delete(e.pointerId); }
  };
  canvas.addEventListener('pointerup', pointerUp);
  canvas.addEventListener('pointercancel', pointerUp);

  // ---------- Sacred geometry backdrop ----------
  const TAU = Math.PI * 2, GOLDEN = Math.PI * (3 - Math.sqrt(5));
  const ring = (n, r, off = 0) =>
    Array.from({ length: n }, (_, i) => [Math.cos(off + TAU * i / n) * r, Math.sin(off + TAU * i / n) * r]);
  const allPairs = pts => pts.flatMap((a, i) => pts.slice(i + 1).map(b => [...a, ...b]));

  // String-art star: spokes with shorter branch generations between them, and
  // straight threads stitched from each spoke across to a neighbour.
  function weave(axes, depth, bscale, skip, d) {
    let spokes = Array.from({ length: axes }, (_, i) => ({ a: -Math.PI / 2 + TAU * i / axes, len: 1 }));
    for (let g = 1; g <= depth; g++) {
      const half = Math.PI / spokes.length;
      spokes = spokes.flatMap(s => [s, { a: s.a + half, len: bscale ** g }]);
    }
    const tips = spokes.map(s => [Math.cos(s.a) * s.len, Math.sin(s.a) * s.len]);
    const lines = [];
    tips.forEach((A, i) => {
      const B = tips[(i + skip) % tips.length];
      lines.push([0, 0, ...A]);
      for (let j = 0; j < d; j++) {
        const fa = (d - j) / d, fb = (j + 1) / d;
        lines.push([A[0] * fa, A[1] * fa, B[0] * fb, B[1] * fb]);
      }
    });
    return { lines, sym: axes };
  }
  const disc = (pts, r) => pts.map(p => [...p, r]);
  // Hex lattice points within n steps of the centre, n steps spanning radius 1 - 1/(n+1)
  function hexPts(n) {
    const r = 1 / (n + 1), pts = [];
    for (let q = -n; q <= n; q++) for (let k = -n; k <= n; k++) {
      const x = (q + k / 2) * r, y = k * r * Math.sqrt(3) / 2;
      if (Math.hypot(x, y) <= n * r + 1e-6) pts.push([x, y]);
    }
    return disc(pts, r);
  }
  const lerp = (a, b, t) => Math.round(a + (b - a) * t);

  // Unit-radius shapes, each drawn as nested counter-rotating layers.
  // t is the complexity slider, 0 (sparse) to 1 (dense).
  const SHAPES = [
    t => ({ layers: lerp(2, 6, t), scale: 0.72, ...weave(6, t < 0.15 ? 0 : t > 0.85 ? 2 : 1, 0.6, 1, lerp(5, 23, t)) }),
    t => ({ layers: lerp(2, 5, t), scale: 0.7,  ...weave(lerp(5, 12, t), 1, 0.78, 1, lerp(5, 20, t)) }),
    t => ({ layers: lerp(2, 5, t), scale: 0.74, ...weave(lerp(5, 13, t), 0, 1, 2, lerp(8, 24, t)) }),
    t => ({ layers: lerp(1, 3, t), scale: 0.5,  circles: [[0, 0, 1], ...hexPts(lerp(1, 4, t))] }),
    t => {
      const u = t >= 0.3 ? 0.2 : 1 / 3; // circle radius; the sparse form has one ring, so it fills the space
      const pts = [[0, 0], ...ring(6, 2 * u), ...(t >= 0.3 ? ring(6, 4 * u) : []), ...(t >= 0.75 ? ring(6, 2 * u * Math.sqrt(3), TAU / 12) : [])];
      return { layers: lerp(1, 3, t), scale: 0.5, lines: allPairs(pts), circles: disc(pts, u) };
    },
    t => ({ layers: lerp(1, 5, t), scale: 0.62, lines: allPairs(ring(lerp(6, 22, t), 1)), circles: [[0, 0, 1]] }),
    t => ({ layers: lerp(1, 5, t), scale: 0.62, circles: disc(ring(lerp(8, 48, t), 0.5), 0.5) }),
  ];
  // Strokes that are copies of each other under the figure's symmetry sit at the same distance
  // from the centre and have the same size. Each such set is an orbit: one ring of matching strokes.
  // Returns the orbits from the centre outward, each ordered by angle around the figure.
  function orbitsOf(shape) {
    const map = new Map();
    const add = (r, size, item) => {
      const key = Math.round(r * 500) + ':' + Math.round(size * 500);
      if (!map.has(key)) map.set(key, { r, items: [] });
      map.get(key).items.push(item);
    };
    for (let [x0, y0, x1, y1] of shape.lines || []) {
      if (Math.hypot(x0, y0) > Math.hypot(x1, y1)) [x0, y0, x1, y1] = [x1, y1, x0, y0]; // lines grow outward
      const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
      add(Math.hypot(mx, my), Math.hypot(x1 - x0, y1 - y0), { x: x0, y: y0, dx: x1 - x0, dy: y1 - y0, a: Math.atan2(my, mx) });
    }
    for (const [x, y, r] of shape.circles || []) {
      const d = Math.hypot(x, y);
      add(d, r + 9, { x, y, r, a: d > 1e-6 ? Math.atan2(y, x) : -Math.PI / 2, circle: true });
    }
    const orbits = [...map.values()].sort((p, q) => p.r - q.r).map(o => o.items.sort((p, q) => p.a - q.a));
    // A figure with few orbits would light up whole from a note or two. Split the biggest
    // into alternate strokes until there is one for every pitch class, or nothing left to split.
    while (orbits.length < 12) {
      const big = orbits.reduce((m, o) => o.length > m.length ? o : m);
      if (big.length < 2) break;
      orbits.splice(orbits.indexOf(big), 1, big.filter((_, k) => k % 2 === 0), big.filter((_, k) => k % 2));
    }
    return orbits;
  }
  const shapeCache = new Map();
  function currentShape() {
    const key = S.gshape + ':' + S.gcomplex;
    if (!shapeCache.has(key)) {
      const shape = (SHAPES[S.gshape] || SHAPES[0])((S.gcomplex - 1) / 9);
      // Dim dense shapes so their centres don't burn out to white
      const strokes = ((shape.lines || []).length + (shape.circles || []).length) * shape.layers;
      shape.dim = Math.min(1, Math.sqrt(900 / strokes));
      shape.orbits = orbitsOf(shape);
      const path = shape.path = new Path2D();
      for (const l of shape.lines || []) { path.moveTo(l[0], l[1]); path.lineTo(l[2], l[3]); }
      for (const c of shape.circles || []) { path.moveTo(c[0] + c[2], c[1]); path.arc(c[0], c[1], c[2], 0, TAU); }
      shapeCache.set(key, shape);
    }
    return shapeCache.get(key);
  }

  // ---------- Playing shapes the backdrop ----------
  // Each note is read as a 2D line: where it sits on the keyboard and how long it is held.
  // Those feed four things, all scaled by the Play response slider:
  //   bands    loudness per register; each backdrop layer swells and brightens with its register
  //   energy   overall loudness; the whole figure breathes and turns a little faster
  //   tonal    running sum of the notes on the circle of fifths; drifts the hue with the key
  //   threads  lines stitched between notes, mirrored into a kaleidoscope over the backdrop
  const BANDS = 8, MAX_THREADS = 90;
  const live = {
    raw: 0, energy: 0, hue: 0, tx: 0, ty: 0,
    band: new Float32Array(BANDS), hold: new Float32Array(BANDS), lv: new Float32Array(BANDS),
  };
  const threads = []; // { a, b, vel, born, bar }  a line from note a to note b; it outlives bar by a fade
  let lastNote = null, lastAt = 0;
  const pitchPos = n => (n - LOW) / (HIGH - LOW);
  function addBand(arr, n, v) {
    const f = pitchPos(n) * (BANDS - 1), i = Math.min(BANDS - 2, Math.floor(f));
    arr[i] += v * (1 - (f - i)); arr[i + 1] += v * (f - i);
  }
  const bandAt = f => {
    const i = Math.min(BANDS - 2, Math.floor(f));
    return live.lv[i] + (live.lv[i + 1] - live.lv[i]) * (f - i);
  };

  function feed(bar) {
    const n = bar.note, vel = bar.vel;
    live.raw = Math.min(1.2, live.raw + vel * 0.3);
    addBand(live.band, n, vel);
    const a = (n * 7 % 12) * TAU / 12;
    live.tx += vel * Math.cos(a); live.ty += vel * Math.sin(a);
    // A chord stitches the new note to the notes under it; a melody stitches it to the note before.
    // A note with nothing to join leaves a ring.
    const others = [...held.keys()].filter(m => m !== n).slice(-4);
    if (!others.length) others.push(lastNote != null && bar.start - lastAt < 4000 ? lastNote : n);
    for (const m of others) threads.push({ a: m, b: n, vel, born: bar.start, bar });
    if (threads.length > MAX_THREADS) threads.splice(0, threads.length - MAX_THREADS);
    lights.push(bar);
    if (lights.length > MAX_LIGHTS) lights.shift();
    lastNote = n; lastAt = bar.start;
  }

  function updateLive(dt) {
    const k = 1 - Math.exp(-dt * 9), decay = Math.exp(-dt * 1.6);
    let sum = 0;
    live.hold.fill(0);
    for (const b of held.values()) { sum += b.vel; addBand(live.hold, b.note, b.vel * 0.6); }
    live.raw = Math.max(live.raw * decay, Math.min(1, sum / 3));
    live.energy += (live.raw - live.energy) * k;
    for (let i = 0; i < BANDS; i++) {
      live.band[i] = Math.min(1.5, Math.max(live.band[i] * decay, live.hold[i]));
      live.lv[i] += (Math.min(1, live.band[i]) - live.lv[i]) * k;
    }
    const fade = Math.exp(-dt / 5);
    live.tx *= fade; live.ty *= fade;
    // Sharp keys pull the hue one way, flat keys the other, up to 50 degrees
    const want = 50 * live.ty / (1.5 + Math.hypot(live.tx, live.ty));
    live.hue += (want - live.hue) * (1 - Math.exp(-dt * 1.5));
  }

  // A note's place in the figure: pitch class sets the angle inside a mirrored wedge,
  // height on the keyboard sets the radius, bass outside to treble inside.
  const notePolar = (n, sym, R) => [((n * 7 % 12) + 0.5) / 12 * Math.PI / sym, R * (1 - 0.88 * pitchPos(n))];
  // 1 while the note is down, then fading to 0. The longer it was held, the longer it lingers.
  const linger = (bar, now, stretch = 1) =>
    bar.end == null ? 1 : 1 - (now - bar.end) / ((1500 + Math.min(4500, (bar.end - bar.start) * 2)) * stretch);

  // ---------- Appears: When played ----------
  // The backdrop has no existence of its own. Each note draws a few rings of the figure's own
  // strokes: its register picks the layer, bass outside to treble inside, and its pitch class
  // picks which rings of that layer. The strokes draw themselves in one after another around
  // the figure, flash on the attack, shimmer while the key is down, then unravel and fade.
  const lights = [], MAX_LIGHTS = 80; // bars still lighting the figure
  function drawLit(now, shape, cx, cy, tf) {
    const orbits = shape.orbits, per = Math.min(12, orbits.length), L = shape.layers;
    const strength = Math.min(1, S.gopacity * 2.5), sat = S.gsat * 100;
    ctx.lineCap = 'round';
    for (let i = lights.length - 1; i >= 0; i--) {
      const b = lights[i], fade = linger(b, now, S.gfade);
      if (fade <= 0) { lights.splice(i, 1); continue; }
      const age = (now - b.start) / 1000 * S.gdraw, dur = 0.5 - 0.25 * b.vel; // louder notes draw faster
      const q = (1 - fade) ** 2;      // how far the stroke has unravelled from its start
      const hit = Math.exp(-(now - b.start) / 200); // attack flash
      const f = pitchPos(b.note) * (L - 1), i0 = Math.floor(f);
      for (const [li, wgt] of [[i0, 1 - (f - i0)], [i0 + 1, f - i0]]) {
        if (li >= L || wgt < 0.15) continue;
        ctx.save();
        ctx.translate(cx, cy); ctx.rotate(tf[li][0]); ctx.scale(tf[li][1], tf[li][1]);
        ctx.beginPath();
        for (let o = (b.note * 7 % 12) % per; o < orbits.length; o += per) {
          const items = orbits[o];
          for (let k = 0; k < items.length; k++) {
            const it = items[k];
            // Each stroke in the ring starts a moment after its neighbour
            const t = Math.min(1, Math.max(0, (age - 0.35 * k / items.length) / dur));
            const p = 1 - (1 - t) ** 3;
            if (p <= q) continue;
            if (it.circle) {
              // Circles close from the side facing the centre, both ways round
              const a0 = it.a + Math.PI, a1 = a0 + Math.PI * q, a2 = a0 - Math.PI * p;
              ctx.moveTo(it.x + Math.cos(a1) * it.r, it.y + Math.sin(a1) * it.r);
              ctx.arc(it.x, it.y, it.r, a1, a0 + Math.PI * p);
              ctx.moveTo(it.x + Math.cos(a2) * it.r, it.y + Math.sin(a2) * it.r);
              ctx.arc(it.x, it.y, it.r, a2, a0 - Math.PI * q);
            } else {
              ctx.moveTo(it.x + it.dx * q, it.y + it.dy * q);
              ctx.lineTo(it.x + it.dx * p, it.y + it.dy * p);
            }
          }
        }
        ctx.restore(); // the path keeps its transform; stroke width stays in screen pixels
        const hue = hueOf(b.note) + S.greact * live.hue;
        const shimmer = b.end == null ? 0.85 + 0.15 * Math.sin(now * 0.006 + b.note * 2.1) : 1;
        const alpha = strength * fade * (0.45 + 0.55 * b.vel) * Math.sqrt(wgt) * shimmer;
        ctx.strokeStyle = `hsla(${hue}, ${sat}%, 60%, ${alpha * 0.16})`;
        ctx.lineWidth = 5 + 4 * b.vel + 6 * hit; ctx.stroke();
        ctx.strokeStyle = `hsla(${hue}, ${sat}%, ${68 + 24 * hit}%, ${alpha})`;
        ctx.lineWidth = (0.8 + b.vel) * (1 + 0.8 * hit); ctx.stroke();
      }
    }
  }

  function drawThreads(now, cx, cy, R, sym) {
    const react = S.greact, base = -Math.PI / 2 + geoT * 0.12;
    const Rf = R * (1 + 0.06 * react * live.energy);
    const polar = n => notePolar(n, sym, Rf);
    ctx.lineCap = 'round';
    for (let i = threads.length - 1; i >= 0; i--) {
      const t = threads[i];
      const a = linger(t.bar, now);
      if (a <= 0) { threads.splice(i, 1); continue; }
      const [pa, ra] = polar(t.a), [pb, rb] = polar(t.b);
      ctx.beginPath();
      for (let k = 0; k < sym; k++) for (const m of [1, -1]) {
        const o = base + k * TAU / sym;
        if (t.a === t.b) {
          const x = cx + Math.cos(o + m * pa) * ra, y = cy + Math.sin(o + m * pa) * ra, r = 2 + 4 * t.vel;
          ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU);
        } else {
          ctx.moveTo(cx + Math.cos(o + m * pa) * ra, cy + Math.sin(o + m * pa) * ra);
          ctx.lineTo(cx + Math.cos(o + m * pb) * rb, cy + Math.sin(o + m * pb) * rb);
        }
      }
      const hue = (hueOf(t.a) + hueOf(t.b)) / 2 + react * live.hue;
      const alpha = S.gopacity * (0.25 + 0.75 * react) * a * Math.min(1, (now - t.born) / 150);
      ctx.strokeStyle = `hsla(${hue}, ${S.gsat * 100}%, 62%, ${alpha * 0.15})`;
      ctx.lineWidth = 4 + 3 * t.vel; ctx.stroke();
      ctx.strokeStyle = `hsla(${hue}, ${S.gsat * 100}%, 72%, ${alpha})`;
      ctx.lineWidth = 0.8 + t.vel; ctx.stroke();
    }
  }

  let geoT = 0;
  function drawGeometry(dt, now, keyTop) {
    updateLive(dt);
    const react = S.greact;
    geoT += dt * S.gspin * (1 + react * live.energy);
    if (S.gopacity <= 0 || keyTop < 40) return;
    const shape = currentShape();
    const R = Math.min(W * 0.48, keyTop * 0.54), cx = W / 2, cy = keyTop / 2;
    const sym = shape.sym || 6, reveal = S.greveal === 1;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, keyTop); ctx.clip();
    ctx.globalCompositeOperation = 'lighter';
    const tf = []; // per layer: [rotation, scale]
    for (let i = 0; i < shape.layers; i++) {
      const rot = i * GOLDEN + geoT * 0.25 * (1 + 0.23 * i) * (i % 2 ? -1 : 1);
      const pos = shape.layers > 1 ? i / (shape.layers - 1) : 0.5; // layer's register, bass outside
      const lv = react * bandAt(pos * (BANDS - 1));
      const s = R * shape.scale ** i * (1 + 0.03 * Math.sin(geoT * 0.9 + i * 1.7))
        * (1 + 0.1 * lv + 0.04 * react * live.energy);
      tf.push([rot, s]);
      if (reveal) continue;
      // Layers step through the same hue range as the keyboard, bass outside to treble inside
      const hue = S.hue + S.spread * pos + react * live.hue, sat = S.gsat * 100;
      const alpha = S.gopacity * shape.dim * (1 + 1.2 * lv);
      // The shape's path is built once in unit space. Line widths are divided by the scale
      // so they stay in screen pixels.
      ctx.save();
      ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(s, s);
      ctx.strokeStyle = `hsla(${hue}, ${sat}%, 60%, ${alpha * 0.12})`;
      ctx.lineWidth = (4 + 3 * lv) / s; ctx.stroke(shape.path);
      ctx.strokeStyle = `hsla(${hue}, ${sat}%, ${66 + 12 * lv}%, ${Math.min(1, alpha * 0.8)})`;
      ctx.lineWidth = 1 / s; ctx.stroke(shape.path);
      ctx.restore();
    }
    if (reveal) drawLit(now, shape, cx, cy, tf);
    if (react > 0) drawThreads(now, cx, cy, R, sym);
    ctx.restore();
  }

  // Rounded bar whose sides follow off(y), a sideways shift that varies with height
  function wavyRect(c, x, y, w, h, r, off) {
    r = Math.min(r, w / 2, h / 2);
    const y1 = y + h, a = Math.max(y + r, -20), b = Math.min(y1 - r, H + 20);
    c.moveTo(x + off(y1 - r), y1 - r);
    for (let yy = b; yy > a; yy -= 5) c.lineTo(x + off(yy), yy);
    c.lineTo(x + off(y + r), y + r);
    c.arcTo(x + off(y), y, x + w / 2 + off(y), y, r);
    c.arcTo(x + w + off(y), y, x + w + off(y + r), y + r, r);
    for (let yy = a; yy < b; yy += 5) c.lineTo(x + w + off(yy), yy);
    c.lineTo(x + w + off(y1 - r), y1 - r);
    c.arcTo(x + w + off(y1), y1, x + w / 2 + off(y1), y1, r);
    c.arcTo(x + off(y1), y1, x + off(y1 - r), y1 - r, r);
    c.closePath();
  }

  // ---------- Bars flatten against the top of the screen ----------
  const smears = []; // { x, w, hue, start, end }  end is set once the bar's tail has gone through
  function drawSmears(now) {
    for (let i = smears.length - 1; i >= 0; i--) {
      const s = smears[i];
      const a = s.end == null ? 1 : 1 - (now - s.end) / 600;
      if (a <= 0) { smears[i] = smears[smears.length - 1]; smears.pop(); continue; }
      if (s.x == null) continue; // the bar crossed the top edge within a single frame
      const rx = s.w * (0.6 + 1.9 * (1 - Math.exp(-(now - s.start) / 160)));
      // One gradient per hue, one unit wide; the transform stretches it to the smear
      ctx.fillStyle = gradient('smear:' + s.hue, () => {
        const g = ctx.createLinearGradient(-1, 0, 1, 0);
        g.addColorStop(0, `hsla(${s.hue}, 95%, 60%, 0)`);
        g.addColorStop(0.5, `hsla(${s.hue}, 95%, 70%, 0.9)`);
        g.addColorStop(1, `hsla(${s.hue}, 95%, 60%, 0)`);
        return g;
      });
      ctx.globalAlpha = a;
      ctx.setTransform(DPR * rx, 0, 0, DPR, DPR * s.x, 0);
      ctx.beginPath(); ctx.ellipse(0, 0, 1, 7, 0, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  // ---------- Weather: rain or snow that lands on the top edge of the keyboard ----------
  const RAIN = 1, SNOW = 2, MAX_WEATHER = 2500;
  const falling = [];  // { type, x, y, vx, vy, z, phase }  z is depth: 0.35 far, 1 near
  const splash = [];   // { type, x, y, vx, vy, life, max, z }  type 'ring' is a rain ripple
  const rnd = (a, b) => a + Math.random() * (b - a);
  // Weather is drawn in batches: everything of one kind and one opacity step shares a path,
  // filled or stroked once with a gradient that carries the keyboard's hues across the screen.
  const STEPS = 8;
  const step = a => Math.min(STEPS - 1, Math.max(0, a * STEPS | 0));
  const pathIn = (set, i) => set[i] ??= new Path2D();
  const tint = (sat, light) => gradient(`tint:${sat}:${light}:${S.hue}:${S.spread}:${W}`, () => {
    const g = ctx.createLinearGradient(0, 0, W, 0);
    for (let i = 0; i <= 12; i++) g.addColorStop(i / 12, `hsl(${S.hue + S.spread * i / 12}, ${sat}%, ${light}%)`);
    return g;
  });
  function paint(set, style, stroke) {
    ctx[stroke ? 'strokeStyle' : 'fillStyle'] = style;
    for (let i = 0; i < STEPS; i++) {
      if (!set[i]) continue;
      ctx.globalAlpha = (i + 0.5) / STEPS;
      stroke ? ctx.stroke(set[i]) : ctx.fill(set[i]);
    }
  }

  function drawWeather(dt, now, keyTop) {
    // Spawn. Switching modes lets what is already in the air finish falling.
    const rate = S.weather === RAIN ? 520 : S.weather === SNOW ? 130 : 0;
    for (let k = Math.floor(rate * S.wamount * dt * W / 1280 + Math.random()); k > 0 && falling.length < MAX_WEATHER; k--) {
      const z = rnd(0.35, 1);
      if (S.weather === RAIN) falling.push({ type: RAIN, x: rnd(-0.05, 1.1) * W, y: -30, vx: -70 * z, vy: rnd(1.3, 1.7) * H * z, z });
      else falling.push({ type: SNOW, x: rnd(-0.05, 1.05) * W, y: -6, vx: rnd(-12, 12), vy: rnd(0.09, 0.15) * H * z, z, phase: rnd(0, TAU) });
    }
    if (!falling.length && !splash.length) return;

    const streaks = [], flakes = [], drops = [], puffs = [], rings = [];

    for (let i = falling.length - 1; i >= 0; i--) {
      const p = falling[i], snow = p.type === SNOW;
      const vx = snow ? p.vx + Math.sin(now / 900 + p.phase) * 28 * p.z : p.vx;
      p.x += vx * dt; p.y += p.vy * dt;
      if (p.y >= keyTop) {
        // Landed: rain kicks up droplets and a ripple, snow puffs and leaves a melting fleck
        if (snow) {
          for (let k = 2 + (Math.random() * 3 | 0); k > 0; k--)
            splash.push({ type: SNOW, x: p.x, y: keyTop - 1, vx: rnd(-26, 26), vy: rnd(-34, -6), life: rnd(0.5, 1), z: p.z * 0.55 });
          splash.push({ type: SNOW, x: p.x, y: keyTop - 1, vx: 0, vy: 0, life: rnd(1.2, 2.2), z: p.z });
        } else {
          for (let k = 2 + (Math.random() * 3 | 0); k > 0; k--)
            splash.push({ type: RAIN, x: p.x, y: keyTop - 1, vx: rnd(-90, 90) * p.z, vy: rnd(-230, -70) * p.z, life: rnd(0.25, 0.5), z: p.z });
          splash.push({ type: 'ring', x: p.x, y: keyTop, vx: 0, vy: 0, life: 0.35, z: p.z });
        }
        falling[i] = falling[falling.length - 1]; falling.pop();
        continue;
      }
      if (snow) {
        const r = 0.6 + 2.2 * p.z, path = pathIn(flakes, step(0.2 + 0.6 * p.z));
        path.moveTo(p.x + r, p.y); path.arc(p.x, p.y, r, 0, TAU);
      } else {
        const tail = 0.022 + 0.012 * p.z; // seconds of travel shown as a streak
        const path = pathIn(streaks, step((p.z - 0.35) / 0.65)); // grouped by depth
        path.moveTo(p.x, p.y); path.lineTo(p.x - p.vx * tail, p.y - p.vy * tail);
      }
    }

    for (let i = splash.length - 1; i >= 0; i--) {
      const p = splash[i];
      p.max ??= p.life;
      p.life -= dt;
      if (p.life <= 0 || p.y > keyTop) { splash[i] = splash[splash.length - 1]; splash.pop(); continue; }
      const a = p.life / p.max;
      if (p.type === 'ring') {
        const rx = (1 - a) * 16 * p.z + 2, path = pathIn(rings, step(a * 0.7 * p.z));
        path.moveTo(p.x + rx, p.y); path.ellipse(p.x, p.y, rx, rx * 0.3, 0, 0, TAU);
        continue;
      }
      p.vy += (p.type === RAIN ? 900 : 55) * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      const r = p.type === RAIN ? 0.5 + 0.8 * p.z : 0.6 + 2.2 * p.z * (p.vx ? 1 : 0.5 + a * 0.5);
      const path = pathIn(p.type === RAIN ? drops : puffs, step(a * (0.25 + 0.6 * p.z)));
      path.moveTo(p.x + r, p.y); path.arc(p.x, p.y, r, 0, TAU);
    }

    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, keyTop); ctx.clip();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    // Streaks get thicker and brighter with nearness, one stroke per depth step
    ctx.strokeStyle = tint(60, 80);
    for (let i = 0; i < STEPS; i++) {
      if (!streaks[i]) continue;
      const z = 0.35 + 0.65 * (i + 0.5) / STEPS;
      ctx.globalAlpha = 0.12 + 0.4 * z;
      ctx.lineWidth = 0.6 + 0.9 * z;
      ctx.stroke(streaks[i]);
    }
    ctx.lineWidth = 1;
    paint(rings, tint(70, 85), true);
    paint(drops, tint(70, 90));
    paint(flakes, tint(45, 90));
    paint(puffs, tint(45, 90));
    ctx.restore();
  }

  // ---------- Render ----------
  const cores = []; // bar cores waiting to be drawn this frame, seven values each
  const barPath = (off, x, y, w, h, r) => { off ? wavyRect(bctx, x, y, w, h, r, off) : bctx.roundRect(x, y, w, h, r); };
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    const ww = W / WHITES;
    const kh = H * S.keys, keyTop = H - kh;
    const pps = S.speed * H; // pixels per second

    // Background
    ctx.fillStyle = gradient(`bg:${keyTop}:${S.hue + S.spread / 2}`, () => {
      const g = ctx.createLinearGradient(0, 0, 0, keyTop);
      g.addColorStop(0, '#04050a');
      g.addColorStop(1, `hsl(${S.hue + S.spread / 2}, 35%, 7%)`);
      return g;
    });
    ctx.fillRect(0, 0, W, H);

    // Octave guide lines
    ctx.fillStyle = 'rgba(255,255,255,0.035)';
    for (let n = LOW; n <= HIGH; n++) if (n % 12 === 0) ctx.fillRect(keyGeo[n].x * ww, 0, 1, keyTop);

    drawGeometry(dt, now, keyTop);
    drawWeather(dt, now, keyTop);

    // Bars
    bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    bctx.clearRect(0, 0, W, H);
    bctx.save();
    bctx.beginPath(); bctx.rect(0, 0, W, keyTop); bctx.clip();
    bctx.globalCompositeOperation = 'lighter';
    cores.length = 0;
    if (!fastGlow) bctx.shadowBlur = S.glow * 34 * DPR;
    for (let i = bars.length - 1; i >= 0; i--) {
      const b = bars[i], g = keyGeo[b.note];
      const yTop = keyTop - (now - b.start) / 1000 * pps;
      const yBot = b.end == null ? keyTop : keyTop - (now - b.end) / 1000 * pps;
      if (yBot < -40) { if (b.smear) b.smear.end ??= now; bars.splice(i, 1); continue; }
      const kw = g.w * ww, w = Math.max(2, kw * S.width);
      const x = g.x * ww + (kw - w) / 2;
      const h = Math.max(yBot - yTop, 3);
      const r = Math.min(w / 2, h / 2) * S.round;
      const light = 48 + b.vel * 22;

      // Wiggle: a wave runs along the bar so every part of it sways side to side as it climbs.
      // It eases in from zero at the key, so the bar still leaves from the key it belongs to.
      const amp = S.wiggle * ww * 1.3, phase = b.note * 0.9;
      const off = amp > 0.05 ? y => {
        const d = keyTop - y;
        return amp * Math.min(1, d / (ww * 3)) * Math.sin(d * 0.028 + now * 0.005 + phase);
      } : null;

      // Shed particles along the bar; the rate tapers with height but never reaches zero
      if (S.shed > 0) {
        const y0 = Math.max(yTop, 0), y1 = Math.min(yTop + h, keyTop);
        const len = y1 - y0;
        if (len > 0) {
          const rise = (keyTop - (y0 + y1) / 2) / keyTop;
          const taper = 0.12 + 0.88 * Math.exp(-rise * 3.2);
          const want = S.shed * amount() * 0.9 * dt * (0.4 + b.vel) * taper * Math.min(len, 400) / 120;
          for (let k = Math.floor(want + Math.random()); k > 0; k--) {
            const sy = y0 + Math.random() * len;
            spawn(
              x + Math.random() * w + (off ? off(sy) : 0),
              sy,
              (Math.random() - 0.5) * 60 * S.pspread * S.pspeed,
              (Math.random() * 70 - 15) * S.pspeed,
              0.5 + Math.random() * 1.2,
              0.6 + Math.random() * 1.5,
              hueOf(b.note) + (Math.random() - 0.5) * 24,
            );
          }
        }
      }

      // Reaching the top of the screen: spread a little left and right, then fade once the tail is through
      if (yTop <= 0) {
        if (!b.smear) smears.push(b.smear = { w, hue: hueOf(b.note) | 0, start: now, end: null });
        if (yBot > 0) b.smear.x = x + w / 2 + (off ? off(0) : 0);
        else b.smear.end ??= now;
      }

      if (!fastGlow) bctx.shadowColor = colorOf(b.note, 60, 1);
      bctx.fillStyle = colorOf(b.note, light, 0.92);
      bctx.beginPath(); barPath(off, x, yTop, w, h, r); bctx.fill();

      // The bright core goes on after the glow, so the glow keeps the bar's colour
      const cw = w * 0.42;
      cores.push(off, x + (w - cw) / 2, yTop + r * 0.5, cw, Math.max(h - r, 1), cw / 2 * S.round, 0.16 + b.vel * 0.2);
    }
    bctx.shadowBlur = 0;
    if (fastGlow && S.glow > 0 && cores.length) glowBars();
    for (let i = 0; i < cores.length; i += 7) {
      bctx.fillStyle = `rgba(255,255,255,${cores[i + 6]})`;
      bctx.beginPath(); barPath(cores[i], cores[i + 1], cores[i + 2], cores[i + 3], cores[i + 4], cores[i + 5]); bctx.fill();
    }
    bctx.restore();

    // Bars cover the backdrop instead of adding to it, so nothing shows through them
    ctx.drawImage(barCanvas, 0, 0, W, H);

    // Impact glow + continuous sparks for held notes
    ctx.globalCompositeOperation = 'lighter';
    for (let n = LOW; n <= HIGH; n++) {
      const on = held.has(n);
      if (!on && flash[n] < 0.01) continue;
      const g = keyGeo[n], cx = (g.x + g.w / 2) * ww;
      const power = (on ? 0.55 : 0) + flash[n] * 0.6;
      const rad = ww * (2.2 + flash[n] * 2.5) * (0.4 + S.glow);
      // One gradient per hue, one unit across; the transform places and sizes it
      const hue = hueOf(n);
      ctx.fillStyle = gradient('note:' + hue, () => {
        const rg = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
        rg.addColorStop(0, `hsla(${hue}, 100%, 78%, 1)`);
        rg.addColorStop(0.3, `hsla(${hue}, 100%, 60%, 0.35)`);
        rg.addColorStop(1, 'hsla(0,0%,0%,0)');
        return rg;
      });
      ctx.globalAlpha = Math.min(1, power);
      ctx.setTransform(DPR * rad, 0, 0, DPR * rad, DPR * cx, DPR * keyTop);
      ctx.fillRect(-1, -1, 2, 1);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      flash[n] *= Math.pow(0.004, dt);
      if (on) burst(n, held.get(n).vel * 0.6, Math.floor(amount() * 5 * dt + Math.random()));
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles[i] = particles[particles.length - 1]; particles.pop(); continue; }
      p.vx += (Math.random() - 0.5) * 240 * S.pspread * S.pspeed * dt;
      p.vy *= Math.pow(0.35, dt);
      p.x += p.vx * dt; p.y += p.vy * dt;
      const a = p.life / p.max;
      const r = p.size * (0.4 + a * 0.6);
      // The smallest used to be squares; a slightly wider dot covers the same area
      const d = r * (r > 1.1 ? 1 : 1.128) * CELL / DOT;
      ctx.globalAlpha = a;
      ctx.drawImage(sprites, p.col * CELL, Math.min(TONES - 1, a * TONES | 0) * CELL, CELL, CELL, p.x - d / 2, p.y - d / 2, d, d);
    }
    ctx.globalAlpha = 1;
    drawSmears(now);
    ctx.globalCompositeOperation = 'source-over';

    // Keyboard
    if (kh > 1) {
      // Keys at rest share one gradient and one fill per colour; held keys are drawn singly
      const bh = kh * 0.63;
      const whiteKey = (x) => ctx.roundRect(x + 0.5, keyTop, ww - 1, kh, [0, 0, ww * 0.12, ww * 0.12]);
      const blackKey = (x, w) => ctx.roundRect(x, keyTop, w, bh, [0, 0, w * 0.15, w * 0.15]);
      const heldFill = (n, bottom, l0, l1) => {
        const kg = ctx.createLinearGradient(0, keyTop, 0, bottom);
        kg.addColorStop(0, colorOf(n, l0)); kg.addColorStop(1, colorOf(n, l1));
        ctx.fillStyle = kg;
        ctx.fill();
      };
      ctx.beginPath();
      for (let n = LOW; n <= HIGH; n++) if (!keyGeo[n].black && !held.has(n)) whiteKey(keyGeo[n].x * ww);
      ctx.fillStyle = gradient(`white:${keyTop}:${H}`, () => {
        const kg = ctx.createLinearGradient(0, keyTop, 0, H);
        kg.addColorStop(0, '#c9ccd6'); kg.addColorStop(0.12, '#f3f4f8'); kg.addColorStop(1, '#ffffff');
        return kg;
      });
      ctx.fill();
      for (const n of held.keys()) {
        if (keyGeo[n].black) continue;
        ctx.beginPath(); whiteKey(keyGeo[n].x * ww); heldFill(n, H, 60, 82);
      }
      ctx.beginPath();
      for (let n = LOW; n <= HIGH; n++) if (keyGeo[n].black && !held.has(n)) blackKey(keyGeo[n].x * ww, keyGeo[n].w * ww);
      ctx.fillStyle = gradient(`black:${keyTop}:${bh}`, () => {
        const kg = ctx.createLinearGradient(0, keyTop, 0, keyTop + bh);
        kg.addColorStop(0, '#0b0c11'); kg.addColorStop(0.85, '#23252f'); kg.addColorStop(1, '#0b0c11');
        return kg;
      });
      ctx.fill();
      for (const n of held.keys()) {
        if (!keyGeo[n].black) continue;
        ctx.beginPath(); blackKey(keyGeo[n].x * ww, keyGeo[n].w * ww); heldFill(n, keyTop + bh, 50, 68);
      }
      // Felt strip
      ctx.fillStyle = gradient(`strip:${S.hue}:${S.spread}:${W}`, () => {
        const strip = ctx.createLinearGradient(0, 0, W, 0);
        strip.addColorStop(0, `hsl(${S.hue}, 90%, 55%)`);
        strip.addColorStop(1, `hsl(${S.hue + S.spread}, 90%, 55%)`);
        return strip;
      });
      ctx.shadowColor = `hsl(${S.hue + S.spread / 2}, 100%, 60%)`;
      ctx.shadowBlur = 12 * S.glow * DPR;
      ctx.fillRect(0, keyTop - 2, W, 2);
      ctx.shadowBlur = 0;
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- UI chrome ----------
  const panel = document.getElementById('panel');
  const togglePanel = () => { panel.hidden = !panel.hidden; };
  const toggleFs = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  };
  document.getElementById('toggle').onclick = togglePanel;
  document.getElementById('fs').onclick = toggleFs;
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'f' || e.key === 'F') toggleFs();
    if (e.key === 'h' || e.key === 'H') togglePanel();
    if (e.key === 'r' || e.key === 'R') randomize();
  });
  canvas.addEventListener('dblclick', e => { if (noteAt(e.clientX, e.clientY) == null) toggleFs(); });

  // Hide the UI and cursor when the mouse rests
  let idleTimer;
  const wake = () => {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if (!document.querySelector('.ui:hover, #code:focus')) document.body.classList.add('idle');
    }, 3000);
  };
  addEventListener('pointermove', wake);
  addEventListener('pointerdown', wake);
  wake();

  // Keep the screen awake while playing
  const lock = () => navigator.wakeLock?.request('screen').catch(() => {});
  lock();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') lock(); });

  window.viz = { noteOn, noteOff };
})();
</script>
</body>
</html>
